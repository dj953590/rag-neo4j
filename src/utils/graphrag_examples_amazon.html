SEP\u003e\"The short-term interest rate benchmark used for loans under the agreement.\""}, {"color": "#e81d87", "description": "\"RFR means the reference rates for various currencies utilized in loan transactions.\"\u003cSEP\u003e\"Refers to risk-free rates used in financial agreements.\"", "entity_type": "\"RATE\"", "id": "\"RFR\"", "label": "\"RFR\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"RFR means the reference rates for various currencies utilized in loan transactions.\"\u003cSEP\u003e\"Refers to risk-free rates used in financial agreements.\""}, {"color": "#a9ead0", "description": "\"A section in the agreement detailing the obligations of the Borrower concerning taxes and fees payable to the lenders.\"\u003cSEP\u003e\"Section 3.01 refers to a specific part of the Loan Document that outlines tax obligations and indemnifications.\"", "entity_type": "\"SCHEDULE\"", "id": "\"SECTION 3.01\"", "label": "\"SECTION 3.01\"", "shape": "dot", "size": 10, "source_id": "chunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85", "title": "\"A section in the agreement detailing the obligations of the Borrower concerning taxes and fees payable to the lenders.\"\u003cSEP\u003e\"Section 3.01 refers to a specific part of the Loan Document that outlines tax obligations and indemnifications.\""}, {"color": "#849b26", "description": "\"\u0027Commitment\u0027 means, as to each Lender, its commitment to make Loans to the Borrowers pursuant to Section 2.01.\"\u003cSEP\u003e\"Any failure to so record or any error in doing so shall not, however, limit or otherwise affect the obligation of the Borrowers hereunder to pay any amount owing with respect to the Obligations.\"\u003cSEP\u003e\"Borrowers are the entities that receive Loans from Lenders and are obligated to repay under specific terms.\"\u003cSEP\u003e\"Borrowers are the parties involved in the loan agreement that are subject to the terms established in the document.\"\u003cSEP\u003e\"Each of the Borrowers agrees to certain obligations relating to payments and errors in payments.\"\u003cSEP\u003e\"Individuals or entities who are specified to receive loans.\"\u003cSEP\u003e\"the Borrowers may borrow under this Section, prepay under Section 2.03, and reborrow under this Section.\"", "entity_type": "\"BORROWER\"", "id": "\"BORROWERS\"", "label": "\"BORROWERS\"", "shape": "dot", "size": 10, "source_id": "chunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-05b4cc5b2660656388ebad9cd016c596\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-f4d032810167311fd685322e589a9173\u003cSEP\u003echunk-6ab6e4615e53048f9d0e33ad97f0a57e\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941", "title": "\"\u0027Commitment\u0027 means, as to each Lender, its commitment to make Loans to the Borrowers pursuant to Section 2.01.\"\u003cSEP\u003e\"Any failure to so record or any error in doing so shall not, however, limit or otherwise affect the obligation of the Borrowers hereunder to pay any amount owing with respect to the Obligations.\"\u003cSEP\u003e\"Borrowers are the entities that receive Loans from Lenders and are obligated to repay under specific terms.\"\u003cSEP\u003e\"Borrowers are the parties involved in the loan agreement that are subject to the terms established in the document.\"\u003cSEP\u003e\"Each of the Borrowers agrees to certain obligations relating to payments and errors in payments.\"\u003cSEP\u003e\"Individuals or entities who are specified to receive loans.\"\u003cSEP\u003e\"the Borrowers may borrow under this Section, prepay under Section 2.03, and reborrow under this Section.\""}, {"color": "#cfa847", "description": "\"Notices refer to the method and requirements for delivering communications between the parties, which must be in writing.\"", "entity_type": "\"SCHEDULE\ ving and receiving notices and handling proceeds of Loans.\"\u003cSEP\u003e\"The Company is involved in loan agreements and provides financial statements and compliance information.\"\u003cSEP\u003e\"The Company is the entity borrowing funds under the loan agreement and is responsible for adhering to the terms set forth in the agreement.\"\u003cSEP\u003e\"The Company or any Subsidiary fails to pay any Material Indebtedness within five days of the date such payment is due.\"\u003cSEP\u003e\"The Company or such Borrower now or hereafter existing under this Agreement or any other Loan Document to such Lender or its Affiliates.\"\u003cSEP\u003e\"The Company refers to the entity subject to the terms and obligations of the Guaranty.\"\u003cSEP\u003e\"The Company refers to the party that has obligations under the loan agreement.\"\u003cSEP\u003e\"The Company shall be under no obligation to mark any Borrower Materials \u0027PUBLIC\u0027.\"\u003cSEP\u003e\"The corporate entity that is subject to the agreements outlined and requires consent for certain financial transactions, particularly those involving assignments.\"\u003cSEP\u003e\"The entity mentioned that may determine withholding or deduction required by applicable law.\"\u003cSEP\u003e\"The entity referred to in a legal context that maintains accounts or provides cash management services.\"\u003cSEP\u003e\"The entity referred to in the document as \u0027the Company\u0027 is the borrower that is part of the loan agreement described.\"\u003cSEP\u003e\"The entity that is the subject of the loan agreement and is seeking to extend the maturity date.\"\u003cSEP\u003e\"The term \u0027Company\u0027 often refers to the business entity that is entering into agreements for borrowing, lending, or other financial activities.\"\u003cSEP\u003e\"means the audited consolidated balance sheet of the Company and its Subsidiaries as of December 31, 2022 and the related consolidated statements of income or operations, stockholders\u2019 equity and cash flows of the Company and its Subsidiaries for the fiscal year then ended.\"\u003cSEP\u003e\"referring collectively to AMAZON.COM, INC. and its subsidiaries in the agreement.\"\u003cSEP\u003e\"the Company shall deliver to the Administrative Agent or the Administrative Agent shall deliver to the Company...\""}, {"color": "#ee7d6b", "description": "\"Kristen Posluszny signed the credit agreement on behalf of THE TORONTO-DOMINION BANK, NEW YORK BRANCH.\"", "entity_type": "\"AUTHORIZED SIGNATORY\"", "id": "\"KRISTEN POSLUSZNY\"", "label": "\"KRISTEN POSLUSZNY\"", "shape": "dot", "size": 10, "source_id": "chunk-f6b97897a15d341a1e0572d6368a4290", "title": "\"Kristen Posluszny signed the credit agreement on behalf of THE TORONTO-DOMINION BANK, NEW YORK BRANCH.\""}, {"color": "#a73d1d", "description": "The \"ADMINISTRATIVE AGENT\" is a crucial entity in the lending process, characterized as the party responsible for managing and overseeing loan agreements on behalf of lenders. This role encompasses various administrative tasks and functions, including the management of communications between borrowers and lenders, the application of payments, and notifications related to defaulting lenders. As delineated in the loan documents, the Administrative Agent acts as an intermediary, representing the collective interests of the lenders and ensuring compliance with the terms outlined in the loan agreement.\n\nThe Administrative Agent is tasked with administering the entire loan transaction process, which includes overseeing the execution of the agreement, enforcing its provisions, and ensuring that all parties adhere to its terms. This includes distributing information and communications to lenders regarding borrowers\u0027 compliance and managing the flow of funds in loan transactions. Furthermore, the Administrative Agent also plays a role in documenting and maintaining records of the loans made by lenders to borrowers and ensuring that these records are conclusive in the absence of manifest error.\n\nThis agent also has specific responsibilities under the agreement, such as notifying lenders of any defaults and managing administrative tasks related to the loan documents. The role is non-fiduciary, meaning the Administrative Agent does not have a legal obligation to act in the best interest of any specific party but instead facilitates the overall process for both lenders and borrowers.\n\nOverall, the Administrative Agent is integral in coordinating agreements between all involved parties, managing lender obligations, and ensuring the operational efficiency of financial transactions as mandated by the loan agreements.", "entity_type": "\"AGENT\"", "id": "\"ADMINISTRATIVE AGENT\"", "label": "\"ADMINISTRATIVE AGENT\"", "shape": "dot", "size": 10, "source_id": "chunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-d4356ca46805b368884b787be8cbc403\u003cSEP\u003echunk-6ab6e4615e53048f9d0e33ad97f0a57e\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-02ceaf00a3c9eb16269f4ca5175e1da9\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-024104f61867a710efed88937d20b566\u003cSEP\u003echunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-05b4cc5b2660656388ebad9cd016c596\u003cSEP\u003echunk-ce242614e7c70072950823bb3955e36c\u003cSEP\u003echunk-681a8d93f2ef85ce7c68923bd55d27e4\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f\u003cSEP\u003echunk-5f3e48899c511bd9c1507e3c0453d886\u003cSEP\u003echunk-56f074a2930435362e3f5 s specific responsibilities under the agreement, such as notifying lenders of any defaults and managing administrative tasks related to the loan documents. The role is non-fiduciary, meaning the Administrative Agent does not have a legal obligation to act in the best interest of any specific party but instead facilitates the overall process for both lenders and borrowers.\n\nOverall, the Administrative Agent is integral in coordinating agreements between all involved parties, managing lender obligations, and ensuring the operational efficiency of financial transactions as mandated by the loan agreements."}, {"color": "#d8da1a", "description": "\"Entities that provide loans or credit to borrowers, involving interest rates and repayment terms.\"\u003cSEP\u003e\"Lenders provide Loans to Designated Borrowers as part of the financial agreement.\"\u003cSEP\u003e\"The LENDERS party hereto include multiple banks involved in the financing.\"\u003cSEP\u003e\"The Lenders are entities providing loans to the Company under the loan agreement.\"\u003cSEP\u003e\"The entities that provide loans or credits to the Company, participating in the lending facility.\"\u003cSEP\u003e\"The term \u0027Lenders\u0027 refers to the financial entities that borrow money and have rights and powers associated with lending as mentioned in the agreement.\"", "entity_type": "\"LENDER\"", "id": "\"LENDERS\"", "label": "\"LENDERS\"", "shape": "dot", "size": 10, "source_id": "chunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-ce242614e7c70072950823bb3955e36c\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-4e2c07f9aa370050ea4c6b0e2067122b\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-56f074a2930435362e3f578a0827e759", "title": "\"Entities that provide loans or credit to borrowers, involving interest rates and repayment terms.\"\u003cSEP\u003e\"Lenders provide Loans to Designated Borrowers as part of the financial agreement.\"\u003cSEP\u003e\"The LENDERS party hereto include multiple banks involved in the financing.\"\u003cSEP\u003e\"The Lenders are entities providing loans to the Company under the loan agreement.\"\u003cSEP\u003e\"The entities that provide loans or credits to the Company, participating in the lending facility.\"\u003cSEP\u003e\"The term \u0027Lenders\u0027 refers to the financial entities that borrow money and have rights and powers associated with lending as mentioned in the agreement.\""}, {"color": "#7201ad", "description": "\"A set of documents pertaining to a loan, which outlines the terms and conditions applicable to the loan.\"\u003cSEP\u003e\"All legal documents that outline the terms, conditions, and agreements related to a loan.\"\u003cSEP\u003e\"Documents detailing the obligations, agreements, and structures surrounding loans and guarantees.\"\u003cSEP\u003e\"Documents that outline the conditions and terms of loan agreements between the lender and the borrower.\"\u003cSEP\u003e\"Loan Documents encompass all contracts and agreements relating to loans made by Lenders to Borrowers, outlining terms and conditions.\"\u003cSEP\u003e\"Loan Documents means this Agreement, each Note, each Designated Borrower Request and Assumption Agreement, each Designated Borrower Notice and the Fee Letter.\"\u003cSEP\u003e\"THIS AGREEMENT AND THE OTHER LOAN DOCUMENTS AND ANY CLAIMS, CONTROVERSY, DISPUTE OR CAUSE OF ACTION ...\"\u003cSEP\u003e\"The Loan Documents include all agreements and contracts relevant to the lending transaction, outlining terms and responsibilities.\"\u003cSEP\u003e\"The set of legal documents that outline the terms of the lending agreement, including rights and obligations of the parties involved.\"\u003cSEP\u003e\"all agreements, documents, and instruments executed by Borrowers and Lenders under the Agreement.\"", "entity_type": "\"AGREEMENT\"", "id": "\"LOAN DOCUMENTS\"", "label": "\"LOAN DOCUMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-f3f17cf7a579171d338315f7798375fb\u003cSEP\u003echunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-7eb7b5bc404a25d999aedbc8e6f0cac4\u003cSEP\u003echunk-ce242614e7c70072950823bb3955e36c\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-02ceaf00a3c9eb16269f4ca5175e1da9\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-c14cd42fa4cdb6464f56e1335cae13d8\u003cSEP\u003echunk-56f074a2930435362e3f578a0827e759", "title": "\"A set of documents pertaining to a loan, which outlines the terms and conditions applicable to the loan.\"\u003cSEP\u003e\"All legal documents that outline the terms, conditions, and agreements related to a loan.\"\u003cSEP\u003e\"Documents detailing the obligations, agreements, and structures surrounding loans and guarantees.\"\u003cSEP\u003e\"Documents that outline the conditions and terms of loan agreements between the lender and the borrower.\"\u003cSEP\u003e\"Loan Documents encompass all contracts and agreements relating to loans made by Lenders to Borrowers, outlining terms and conditions.\"\u003cSEP\u003e\"Loan Documents means this Agreement, each Note, each Designated Borrower Request and Assumption Agreement, each Designated Borrower Notice and the Fee Letter.\"\u003cSEP\u003e\"THIS AGREEMENT AND THE OTHER LOAN DOCUMENTS AND ANY CLAIMS, CONTROVERSY, DISPUTE OR CAUSE OF ACTION ...\"\u003cSEP\u003e\"The Loan Documents include all agreements and contracts relevant to the lending transaction, outlining terms and responsibilities.\"\u003cSEP\u003e\"The set of legal documents that outline the terms of the lending agreement, including rights and obligations of the parties involved.\"\u003cSEP\u003e\"all agreements, documents, and instruments executed by Borrowers and Lenders under the Agreement.\""}, {"color": "#5d4829", "description": "\"The FIVE-YEAR REVOLVING CREDIT AGREEMENT is dated November 1, 2023 and involves multiple financial institutions as parties.\"\u003cSEP\u003e\"The parties hereto have caused this Agreement to be duly executed as of the date first above written.\"", "entity_type": "\"AGREEMENT\"", "id": "\"FIVE-YEAR REVOLVING CREDIT AGREEMENT\"", "label": "\"FIVE-YEAR REVOLVING CREDIT AGREEMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-4e2c07f9aa370050ea4c6b0e2067122b\u003cSEP\u003echunk-7eb7b5bc404a25d999aedbc8e6f0cac4", "title": "\"The FIVE-YEAR REVOLVING CREDIT AGREEMENT is dated November 1, 2023 and involves multiple financial institutions as parties.\"\u003cSEP\u003e\"The parties hereto have caused this Agreement to be duly executed as of the date first above written.\""}, {"color": "#b95e0a", "description": "The term \"Lender\" refers to an entity, typically a financial institution or individual, that provides loans or credit to borrowers under specific agreements and terms. Each Lender has a commitment to make Loans as outlined in various sections of the agreements, such as Section 2.01. They expect to be repaid with interest and are responsible for complying with applicable laws, including provisions related to the reporting requirements of the Foreign Account Tax Compliance Act (FATCA).\n\nLenders participate in the loan process, which includes providing funds, commitments, and receiving financial information from the borrowers. They are responsible for maintaining documentation related to the Loans and may not be required to assign or delegate their obligations without specific waivers or conditions being met. Each Lender has the right to approve or disapprove amendments, waivers, or consents regarding the agreements they enter into.\n\nThe definition of Lender encompasses each Person listed on a specified schedule and any other party that becomes involved through an Assignment and Assumption. Furthermore, Lenders are tasked with notifying the Administrative Agent in case of erroneous payments and must also ensure compliance with laws concerning material non-public information (MNPI).\n\nOverall, Lenders play a crucial role in the loan framework by providing necessary funds, ensuring adherence to loan terms, and maintaining ongoing engagement with the borrowers and various participating entities. They contribute significantly to the financial operations outlined in the loan agreements.", "entity_type": "\"LENDER\"", "id": "\"LENDER\"", "label": "\"LENDER\"", "shape": "dot", "size": 10, "source_id": "chunk-f3f17cf7a579171d338315f7798375fb\u003cSEP\u003echunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-d4356ca46805b368884b787be8cbc403\u003cSEP\u003echunk-6ab6e4615e53048f9d0e33ad97f0a57e\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-02ceaf00a3c9eb16269f4ca5175e1da9\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-024104f61867a710efed88937d20b566\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856\u003cSEP\u003echunk-05b4cc5b2660656388ebad9cd016c596\u003cSEP\u003echunk-681a8d93f2ef85ce7c68923bd55d27e4\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f\u003cSEP\u003echunk-5f3e48899c511bd9c1507e3c0453d886\u003cSEP\u003echunk-7eb7b5bc404a25d999aedbc8e6f0cac4\u003cSEP\u003echunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-8c4b020bf60daa77bdf0578ce86ca311\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f\u003cSEP\u003echunk-63dba9e522714ac0a8717c04f114cbd9\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-f4d032810167311fd685322e589a9173\u003cSEP\u003echunk-cd612893d5a0225fd778ba086853009a\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d\u003cSEP\u003echunk-ca3882e5c61b45ffe53e6ae54b7b7651", "title": "The term \"Lender\" refers to an entity, typically a financial institution or individual, that provides loans or credit to borrowers under specific agreements and terms. Each Lender has a commitment to make Loans as outlined in various sections of the agreements, such as Section 2.01. They expect to be repaid with interest and are responsible for complying with applicable laws, including provisions related to the reporting requirements of the Foreign Account Tax Compliance Act (FATCA).\n\nLenders participate in the loan process, which includes providing funds, commitments, and receiving financial information from the borrowers. They are responsible for maintaining documentation related to the Loans and may not be required to assign or delegate their obligations without specific waivers or conditions being met. Each Lender has the right to approve or disapprove amendments, waivers, or consents regarding the agreements they enter into.\n\nThe definition of Lender encompasses each Person listed on a specified schedule and any other party that becomes involved through an Assignment and Assumption. Furthermore, Lenders are tasked with notifying the Administrative Agent in case of erroneous payments and must also ensure compliance with laws concerning material non-public information (MNPI).\n\nOverall, Lenders play a crucial role in the loan framework by providing necessary funds, ensuring adherence to loan terms, and maintaining ongoing engagement with the borrowers and various participating entities. They contribute significantly to the financial operations outlined in the loan agreements."}, {"color": "#2f072f", "description": "\"A benchmark for sterling overnight rates as used in the loan agreements.\"\u003cSEP\u003e\"Daily Simple SONIA is a daily benchmark interest rate used for borrowing calculations.\"\u003cSEP\u003e\"The Daily Simple SONIA is the reference rate for Loans or Borrowings denominated in Sterling.\"\u003cSEP\u003e\"The Sterling Overnight Index Average, an interest rate benchmark for overnight lending in GBP.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"DAILY SIMPLE SONIA\"", "label": "\"DAILY SIMPLE SONIA\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85", "title": "\"A benchmark for sterling overnight rates as used in the loan agreements.\"\u003cSEP\u003e\"Daily Simple SONIA is a daily benchmark interest rate used for borrowing calculations.\"\u003cSEP\u003e\"The Daily Simple SONIA is the reference rate for Loans or Borrowings denominated in Sterling.\"\u003cSEP\u003e\"The Sterling Overnight Index Average, an interest rate benchmark for overnight lending in GBP.\""}, {"color": "#ec192b", "description": "\"\u0027SONIA\u0027 refers to the Sterling Overnight Index Average, a benchmark for borrowing in Sterling.\"\u003cSEP\u003e\"SONIA means, with respect to any Business Day, a rate per annum equal to the Sterling Overnight Index Average for such Business Day published by the SONIA Administrator.\"\u003cSEP\u003e\"SONIA serves as a benchmark for loans and interest calculations.\"\u003cSEP\u003e\"the Sterling Overnight Index Average for Pound Sterling transactions.\"", "entity_type": "\"BASE RATE BENCHMARK\"", "id": "\"SONIA\"", "label": "\"SONIA\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-05b4cc5b2660656388ebad9cd016c596", "title": "\"\u0027SONIA\u0027 refers to the Sterling Overnight Index Average, a benchmark for borrowing in Sterling.\"\u003cSEP\u003e\"SONIA means, with respect to any Business Day, a rate ification under the loan agreement, specifically against losses related to the execution and delivery of the Loan Document and other related obligations.\"", "entity_type": "\"SECURED PARTY\"", "id": "\"INDEMNITEE\"", "label": "\"INDEMNITEE\"", "shape": "dot", "size": 10, "source_id": "chunk-ca3882e5c61b45ffe53e6ae54b7b7651", "title": "\"An Indemnitee is a party entitled to indemnification under the loan agreement, specifically against losses related to the execution and delivery of the Loan Document and other related obligations.\""}, {"color": "#e7d802", "description": "\"Brian Crowley signed the credit agreement on behalf of BANCO BILBAO VIZCAYA ARGENTARIA, S.A.\"", "entity_type": "\"AUTHORIZED SIGNATORY\"", "id": "\"BRIAN CROWLEY\"", "label": "\"BRIAN CROWLEY\"", "shape": "dot", "size": 10, "source_id": "chunk-f6b97897a15d341a1e0572d6368a4290", "title": "\"Brian Crowley signed the credit agreement on behalf of BANCO BILBAO VIZCAYA ARGENTARIA, S.A.\""}, {"color": "#62c527", "description": "\"A specific date on which the value of an asset or liability is reassessed for financial reporting.\"\u003cSEP\u003e\"The Revaluation Date refers to the date of rate evaluation for Loans denominated in Alternative Currency.\"", "entity_type": "\"AGREEMENT\"", "id": "\"REVALUATION DATE\"", "label": "\"REVALUATION DATE\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb", "title": "\"A specific date on which the value of an asset or liability is reassessed for financial reporting.\"\u003cSEP\u003e\"The Revaluation Date refers to the date of rate evaluation for Loans denominated in Alternative Currency.\""}, {"color": "#9659dc", "description": "\"A description of loans made to the same borrower under similar conditions.\"\u003cSEP\u003e\"Borrowing refers to taking funds from a lender with an agreement to pay back with interest.\"", "entity_type": "\"AGREEMENT\"", "id": "\"BORROWING\"", "label":  as borrowers under the terms of the Loan Documents.\"\u003cSEP\u003e\"The DESIGNATED BORROWERS are the parties who are borrowing under the agreement.\""}, {"color": "#78b89d", "description": "\"\u0027Guarantee Obligations\u0027 has the meaning specified in Section [not provided].\"\u003cSEP\u003e\"Guarantee Obligations has the meaning specified in Section 10.01.\"\u003cSEP\u003e\"Guarantee Obligations refer to all obligations that the Company guarantees under the terms of the Guaranty.\"\u003cSEP\u003e\"These refer to the obligations guaranteed by the Company for the payment of loans to the Credit Parties.\"", "entity_type": "\"AGREEMENT\"", "id": "\"GUARANTEE OBLIGATIONS\"", "label": "\"GUARANTEE OBLIGATIONS\"", "shape": "dot", "size": 10, "source_id": "chunk-365109d2a10139b03b825bac3b05cc13\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Guarantee Obligations\u0027 has the meaning specified in Section [not provided].\"\u003cSEP\u003e\"Guarantee Obligations has the meaning specified in Section 10.01.\"\u003cSEP\u003e\"Guarantee Obligations refer to all obligations that the Company guarantees under the terms of the Guaranty.\"\u003cSEP\u003e\"These refer to the obligations guaranteed by the Company for the payment of loans to the Credit Parties.\""}, {"color": "#3c32de", "description": "\"\u0027Credit Parties\u0027 means, collectively, the Administrative Agent, the Lenders, the Indemnitees and each co-agent or sub-agent appointed by the Administrative Agent.\"\u003cSEP\u003e\"Credit Parties refers to those entities that are receiving the guarantees or obligations under the Loan Documents.\"\u003cSEP\u003e\"Refers to the group of entities entitled to the Guarantee Obligations from the Borrowers.\"", "entity_type": "\"CORPORATION\"", "id": "\"CREDIT PARTIES\"", "label": "\"CREDIT PARTIES\"", "shape": "dot", "size": 10, "source_id": "chunk nder\u0027s obligations and liabilities related to any expenses under the Agreement.\"\u003cSEP\u003e\"The Administrative Agent will promptly distribute to each Lender its Applicable Percentage of such payment.\"\u003cSEP\u003e\"The specific percentage used to determine a lender\u0027s share of obligations and liabilities in shared expenses.\""}, {"color": "#5ff7e6", "description": "\"Aggregate Commitments refer to the total amount committed by each Lender as per the agreement.\"\u003cSEP\u003e\"Aggregate Commitments refer to the total amount that lenders are willing to provide to borrowers within a period.\"\u003cSEP\u003e\"Refers to the total commitment amount agreed upon by Lenders for the Borrowers.\"\u003cSEP\u003e\"The total amount committed by the Lenders to be provided as loans to the Company under the agreement.\"\u003cSEP\u003e\"The total amount of credit that the Lenders have agreed to provide and maintain.\"\u003cSEP\u003e\"Total amount committed by all Lenders under the loan structure.\"\u003cSEP\u003e\"the Commitments of all the Lenders at such time, totaling US$15,000,000,000 as of the Closing Date.\"\u003cSEP\u003e\"the Total Outstandings shall not exceed the Aggregate Commitments.\"\u003cSEP\u003e\"the total commitments made by lenders in relation to a credit facility.\"", "entity_type": "\"AGREEMENT\"", "id": "\"AGGREGATE COMMITMENTS\"", "label": "\"AGGREGATE COMMITMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-f3f17cf7a579171d338315f7798375fb\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0", "title": "\"Aggregate Commitments refer to the total amount committed by each Lender as per the agreement.\"\u003cSEP\u003e\"Aggregate Commitments refer to the total amount that lenders are willing to provide to borrowers within a period.\"\u003cSEP\u003e\"Refers to the total commitment amount agreed upon by Lenders for the Borrowers.\"\u003cSEP\u003e\"The total amount committed by the Lenders to be provided as loans to the Company under the agreement.\"\u003cSEP\u003e\"The total amount of credit that the Lenders have agreed to provide and maintain.\"\u003cSEP\u003e\"Total amount committed by all Lenders under the loan structure.\"\u003cSEP\u003e\"the Commitments of all the Lenders at such time, totaling US$15,000,000,000 as of the Closing Date.\"\u003cSEP\u003e\"the Total Outstandings shall not exceed the Aggregate Commitments.\"\u003cSEP\u003e\"the total commitments made by lenders in relation to a credit facility.\""}, {"color": "#58ff2a", "description": "\"A specific section in the U.S. tax code requiring compliance by lenders regarding FATCA, detailing reporting requirements.\"", "entity_type": "\"REGULATORY\"", "id": "\"SECTION 1471(B)\"", "label": "\"SECTION 1471(B)\"", "shape": "dot", "size": 10, "source_id": "chunk-b3968ce1cdbdbce306c2d8875f076185", "title": "\"A specific section in the U.S. tax code requiring compliance by lenders regarding FATCA, detailing reporting requirements.\""}, {"color": "#742aa5", "description": "\"Another section in the U.S. tax code related to FATCA, outlining additional regulations for lenders.\"", "entity_type": "\"REGULATORY\"", "id": "\"SECTION 1472(B)\"", "label": "\"SECTION 1472(B)\"", "shape": "dot", "size": 10, "source_id": "chunk-b3968ce1cdbdbce306c2d8875f076185", "title": "\"Another section in the U.S. tax code related to FATCA, outlining additional regulations for lenders.\""}, {"color": "#312df4", "description": "\"Loans that are priced based on a risk-free rate, aiming to provide better clarity on costs for borrowers.\"\u003cSEP\u003e\"RFR Loans are loans based on a Risk-Free Rate, often linked to a specific benchmark.\"", "entity_type": "\"FACILITY\"", "id": "\"RFR LOANS\"", "label": "\"RFR LOANS\"", "shape": "dot", "size": 10, "source_id": "chunk-1a887c72da47ff4eea9f79e69a645a7b\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e", "title": "\"Loans that are priced based on a risk-free rate, aiming to provide better clarity on costs for borrowers.\"\u003cSEP\u003e\"RFR Loans are loans based on a Risk-Free Rate, often linked to a specific benchmark.\""}, {"color": "#d47476", "description": "\"Term SOFR Reference Rate is the tea rate published for loans in US Dollars.\"\u003cSEP\u003e\"The Term SOFR Reference Rate is the forward-looking term rate based on SOFR published for specific tenors.\"", "entity_type": "\"BENCHMARK RATE\"", "id": "\"TERM SOFR REFERENCE RATE\"", "label": "\"TERM SOFR REFERENCE RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0", "title": "\"Term SOFR Reference Rate is the tea rate published for loans in US Dollars.\"\u003cSEP\u003e\"The Term SOFR Reference Rate is the forward-looking term rate based on SOFR published for specific tenors.\""}, {"color": "#a22bc3", "description": "\"An authority responsible for administering the SOFR benchmark rates, vital for loan calculations.\"\u003cSEP\u003e\"CME Group Benchmark Administration Limited, responsible for administering the term Secured Overnight Financing Rate.\"\u003cSEP\u003e\"The CME Term SOFR Administrator is responsible for publishing the Term SOFR rate used in financial agreements and benchmarks.\"", "entity_type": "\"CORPORATION\"", "id": "\"CME TERM SOFR ADMINISTRATOR\"", "label": "\"CME TERM SOFR ADMINISTRATOR\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803", "title": "\"An authority responsible for administering the SOFR benchmark rates, vital for loan calculations.\"\u003cSEP\u003e\"CME Group Benchmark Administration Limited, responsible for administering the term Secured Overnight Financing Rate.\"\u003cSEP\u003e\"The CME Term SOFR Administrator is responsible for publishing the Term SOFR rate used in financial agreements and benchmarks.\""}, {"color": "#fd3cdd", "description": "\"Term CORRA is a benchmark interest rate used for loans denominated in Canadian dollars. It determines the interest cost for borrowers.\"\u003cSEP\u003e\"Term CORRA is a forward-looking rate based on the Canadian Overnight Rate.\"\u003cSEP\u003e\"Term CORRA is a term structure for the Canadian Overnight Reference Rate used for borrowing.\"", "entity_type": "\"BASE RATE BENCHMARK\"", "id": "\"TERM CORRA\"", "label": "\"TERM CORRA\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b", "title": "\"Term CORRA is a benchmark interest rate used for loans denominated in Canadian dollars. It determines the interest cost for borrowers.\"\u003cSEP\u003e\"Term CORRA is a forward-looking rate based on the Canadian Overnight Rate.\"\u003cSEP\u003e\"Term CORRA is a term structure for the Canadian Overnight Reference Rate used for borrowing.\""}, {"color": "#2a203b", "description": "\"A substitute benchmark that takes the place of an existing benchmark in loan agreements.\"\u003cSEP\u003e\"A term used to describe a substitute for the current Benchmark as stipulated in the agreement.\"\u003cSEP\u003e\"Benchmark Replacement refers to an adjusted rate that replaces an existing benchmark rate.\"\u003cSEP\u003e\"The Benchmark Replacement is a predefined interest rate that replaces the original benchmark in the case of unavailability.\"\u003cSEP\u003e\"The condition referring to the replacement of a benchmark in financial transactions to maintain consistency with market standards.\"\u003cSEP\u003e\"replacement benchmarks for interest rates specified within the loan agreement.\"\u003cSEP\u003e\"the replacement rate that takes effect following a Benchmark Transition Event.\"", "entity_type": "\"AGREEMENT\"", "id": "\"BENCHMARK REPLACEMENT\"", "label": "\"BENCHMARK REPLACEMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b", "title": "\"A substitute benchmark that takes the place of an existing benchmark in loan agreements.\"\u003cSEP\u003e\"A term used to describe a substitute for the current Benchmark as stipulated in the agreement.\"\u003cSEP\u003e\"Benchmark Replacement refers to an adjusted rate that replaces an existing benchmark rate.\"\u003cSEP\u003e\"The Benchmark Replacement is a predefined interest rate that replaces the original benchmark in the case of unavailability.\"\u003cSEP\u003e\"The condition referring to the replacement of a benchmark in financial transactions to maintain consistency with market standards.\"\u003cSEP\u003e\"replacement benchmarks for interest rates specified within the loan agreement.\"\u003cSEP\u003e\"the replacement rate that takes effect following a Benchmark Transition Event.\""}, {"color": "#5b06a6", "description": "\"The Commitment Fee is a fee paid by the Company to the Administrative Agent for the Lender\u0027s available funds.\"", "entity_type": "\"FEE\"", "id": "\"COMMITMENT FEE\"", "label": "\"COMMITMENT FEE\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0", "title": "\"The Commitment Fee is a fee paid by the Company to the Administrative Agent for the Lender\u0027s available funds.\""}, {"color": "#8d7550", "description": "\"Section 2.07(a) provides for commitment fees payable to Lenders.\"\u003cSEP\u003e\"Section 2.07(a) specifies the fee structure related to the Commitment Fee to be paid by the Company.\"", "entity_type": "\"SECTION\"", "id": "\"SECTION 2.07(A)\"", "label": "\"SECTION 2.07(A)\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"Section 2.07(a) provides for commitment fees payable to Lenders.\"\u003cSEP\u003e\"Section 2.07(a) specifies the fee structure related to the Commitment Fee to be paid by the Company.\""}, {"color": "#82212f", "description": "\"Nicholas Heslip signed the credit agreement on behalf of Royal Bank of Canada.\"", "entity_type": "\"AUTHORIZED SIGNATORY\"", "id": "\"NICHOLAS HESLIP\"", "label": "\"NICHOLAS HESLIP\"", "shape": "dot", "size": 10, "source_id": "chunk-f6b97897a15d341a1e0572d6368a4290", "title": "\"Nicholas Heslip signed the credit agreement on behalf of Royal Bank of Canada.\""}, {"color": "#7ea09a", "description": "\"Loan Accounts refer to records maintained by Lenders and the Administrative Agent to track loans issued to the Borrower.\"", "entity_type": "\"ACCOUNTS\"", "id": "\"LOAN ACCOUNTS\"", "label": "\"LOAN ACCOUNTS\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0", "title": "\"Loan Accounts refer to records maintained by Lenders and the Administrative Agent to track loans issued to the Borrower.\""}, {"color": "#fe388f", "description": "\"A Term SOFR Loan is a loan that bears interest based on the Term SOFR rate.\"", "entity_type": "\"LOAN\"", "id": "\"TERM SOFR LOAN\"", "label": "\"TERM SOFR LOAN\"", "shape": "dot", "size": 10, "source_id": "chunk-d66da8a55a9bfe53a234f03c63fcb1d0", "title": "\"A Term SOFR Loan is a loan that bears interest based on the Term SOFR rate.\""}, {"color": "#8275ea", "description": "\"A benchmark interest rate that is used for funding Term Benchmark Loans.\"\u003cSEP\u003e\"A term rate based on the Secured Overnight Financing Rate, used in various borrowing agreements.\"\u003cSEP\u003e\"Term SOFR is a benchmark interest rate applicable for some Borrowings.\"\u003cSEP\u003e\"Term SOFR is a benchmark rate that is published by the CME Term SOFR Administrator and used for various borrowing agreements.\"\u003cSEP\u003e\"Term SOFR is the relevant rate for any Term Benchmark Loan denominated in US Dollars.\"\u003cSEP\u003e\"Term SOFR means a specific rate published by the CME Term SOFR Administrator for US Dollar denominated transactions.\"\u003cSEP\u003e\"The Secured Overnight Financing Rate used as a benchmark for determining interest rates on loans.\"\u003cSEP\u003e\"is the Secured Overnight Financing Rate for a one-month interest period used for various financial transactions.\"\u003cSEP\u003e\"the Secured Overnight Financing Rate for term loans.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"TERM SOFR\"", "label": "\"TERM SOFR\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0", "title": "\"A benchmark interest rate that is used for funding Term Benchmark Loans.\"\u003cSEP\u003e\"A term rate based on the Secured Overnight Financing Rate, used in various borrowing agreements.\"\u003cSEP\u003e\"Term SOFR is a benchmark interest rate applicable for some Borrowings.\"\u003cSEP\u003e\"Term SOFR is a benchmark rate that is published by the CME Term SOFR Administrator and used for various borrowing agreements.\"\u003cSEP\u003e\"Term SOFR is the relevant rate for any Term Benchmark Loan denominated in US Dollars.\"\u003cSEP\u003e\"Term SOFR means a specific rate published by the CME Term SOFR Administrator for US Dollar denominated transactions.\"\u003cSEP\u003e\"The Secured Overnight Financing Rate used as a benchmark for determining interest rates on loans.\"\u003cSEP\u003e\"is the Secured Overnight Financing Rate for a one-month interest period used for various financial transactions.\"\u003cSEP\u003e\"the Secured Overnight Financing Rate for term loans.\""}, {"color": "#6ec8d5", "description": "\"A transaction made from one party to another, usually representing the return of funds erroneously transmitted or agreed payments.\"", "entity_type": "\"FINANCIAL TRANSACTION\"", "id": "\"PAYMENT\"", "label": "\"PAYMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-ce242614e7c70072950823bb3955e36c", "title": "\"A transaction made from one party to another, usually representing the return of funds erroneously transmitted or agreed payments.\""}, {"color": "#de16bf", "description": "\"A TIBOR Loan is a loan that bears interest at a rate based on the TIBO Rate.\"", "entity_type": "\"LOAN\"", "id": "\"TIBOR LOAN\"", "label": "\"TIBOR LOAN\"", "shape": "dot", "size": 10, "source_id": "chunk-d66da8a55a9bfe53a234f03c63fcb1d0", "title": "\"A TIBOR Loan is a loan that bears interest at a rate based on the TIBO Rate.\""}, {"color": "#331486", "description": "\"A benchmark interest rate for loans, though less common than others mentioned.\"\u003cSEP\u003e\"A benchmark interest rate referred to for lending in specific markets.\"\u003cSEP\u003e\"The TIBO Rate is the Tokyo interbank offered rate used for denominating loans in Yen.\"\u003cSEP\u003e\"The TIBO Rate is the relevant interest rate for Loans or Borrowings denominated in Yen.\"\u003cSEP\u003e\"The Thai Interbank Offered Rate used for financial transactions in Thailand.\"\u003cSEP\u003e\"the Tokyo Interbank Offered Rate for loans in Yen.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"TIBO RATE\"", "label": "\"TIBO RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85", "title": "\"A benchmark interest rate for loans, though less common than others mentioned.\"\u003cSEP\u003e\"A benchmark interest rate referred to for lending in specific markets.\"\u003cSEP\u003e\"The TIBO Rate is the Tokyo interbank offered rate used for denominating loans in Yen.\"\u003cSEP\u003e\"The TIBO Rate is the relevant interest rate for Loans or Borrowings denominated in Yen.\"\u003cSEP\u003e\"The Thai Interbank Offered Rate used for financial transactions in Thailand.\"\u003cSEP\u003e\"the Tokyo Interbank Offered Rate for loans in Yen.\""}, {"color": "#8dba64", "description": "\"Base Rate Loan is characterized by its link to a specified base interest rate.\"\u003cSEP\u003e\"Base Rate Loans are loans that are pegged to a variable base interest rate.\"", "entity_type": "\"LOAN\"", "id": "\"BASE RATE LOAN\"", "label": "\"BASE RATE LOAN\"", "shape": "dot", "size": 10, "source_id": "chunk-d66da8a55a9bfe53a234f03c63fcb1d0\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa", "title": "\"Base Rate Loan is characterized by its link to a specified base interest rate.\"\u003cSEP\u003e\"Base Rate Loans are loans that are pegged to a variable base interest rate.\""}, {"color": "#70a85f", "description": "\"\u0027Loan\u0027 is the amount of money that is borrowed and is to be paid back with interest.\"\u003cSEP\u003e\"A Loan is a sum of money borrowed that is expected to be paid back with interest over time.\"\u003cSEP\u003e\"A formal agreement in which one party lends money to another, which must be repaid with conditions attached.\"\u003cSEP\u003e\"A sum of money lent to a Borrower with specific terms as stipulated in Loan Documents.\"\u003cSEP\u003e\"A type of financial product where the Lender provides a certain amount of funds to the Borrowers under agreed terms.\"\u003cSEP\u003e\"Each Lender severally agrees to make loans (each such loan, a \u0027Loan\u0027).\"\u003cSEP\u003e\"Loan has the meaning specified in Section 2.01.\"\u003cSEP\u003e\"Loans are amounts of money borrowed that must be repaid with interest.\"\u003cSEP\u003e\"Refers to the financial arrangements made by the Company, which require specific compliance with the terms outlined in the Loan Document.\"\u003cSEP\u003e\"Refers to the funds borrowed by the Borrower which are subject to repayment terms.\"\u003cSEP\u003e\"The Loan represents a financial facility provided by the Lenders to the Borrower as per the agreement.\"\u003cSEP\u003e\"The Loan represents financial assistance provided to the Borrower by the Lenders, governed by the terms outlined in the Loan Documents.\"\u003cSEP\u003e\"The amount of money that is borrowed, often under specified terms and conditions.\"\u003cSEP\u003e\"The amount of money that is lent to the Borrower under the terms agreed upon.\"\u003cSEP\u003e\"The financial product that consists of borrowed money that is expected to be paid back with interest.\"\u003cSEP\u003e\"a borrowing as defined in the Agreement.\"", "entity_type": "\"AGREEMENT\"", "id": "\"LOAN\"", "label": "\"LOAN\"", "shape": "dot", "size": 10, "source_id": "chunk-f3f17cf7a579171d338315f7798375fb\u003cSEP\u003echunk-63dba9e522714ac0a8717c04f114cbd9\u003cSEP\u003echunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856 actions and defined under U.S. law.\""}, {"color": "#72d433", "description": "\"An entity or individual who qualifies under U.S. regulations, particularly relevant for the appointment of successor Administrative Agents.\"\u003cSEP\u003e\"U.S. Person denotes any person who is recognized as a United States citizen or resident for tax purposes.\"\u003cSEP\u003e\"in the event that a Borrower is a U.S. Person, any Lender that is a U.S. Person shall deliver to the Company and the Administrative Agent...\"", "entity_type": "\"INDIVIDUAL\"", "id": "\"U.S. PERSON\"", "label": "\"U.S. PERSON\"", "shape": "dot", "size": 10, "source_id": "chunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0\u003cSEP\u003echunk-ce242614e7c70072950823bb3955e36c", "title": "\"An entity or individual who qualifies under U.S. regulations, particularly relevant for the appointment of successor Administrative Agents.\"\u003cSEP\u003e\"U.S. Person denotes any person who is recognized as a United States citizen or resident for tax purposes.\"\u003cSEP\u003e\"in the event that a Borrower is a U.S. Person, any Lender that is a U.S. Person shall deliver to the Company and the Administrative Agent...\""}, {"color": "#07125f", "description": "\"\u0027Loans\u0027 are the amounts of money borrowed under terms agreed upon between the Borrowers and the Lender.\"\u003cSEP\u003e\"Amounts of money which are borrowed and to be returned under specified conditions, typically with interest.\"\u003cSEP\u003e\"Loans are the amounts borrowed by Borrowers from Lenders according to the terms set out in the Loan Agreement.\"\u003cSEP\u003e\"Loans refer to amounts provided to Designated Borrowers under the terms set forth in the Agreement.\"\u003cSEP\u003e\"Loans refer to the amounts provided by Lenders to Designated Borrowers under the terms specified in the Loan Document.\"\u003cSEP\u003e\"The Loans made by each Lender shall be evidenced by one or more accounts or records maintained by ed to do so, deliver to the Company and the Administrative Agent...\"", "entity_type": "\"LENDER\"", "id": "\"FOREIGN LENDER\"", "label": "\"FOREIGN LENDER\"", "shape": "dot", "size": 10, "source_id": "chunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Foreign Lender\u0027 means a Lender that is not a U.S. Person.\"\u003cSEP\u003e\"any Foreign Lender shall, to the extent it is legally entitled to do so, deliver to the Company and the Administrative Agent...\""}, {"color": "#32c569", "description": "\"Payments made to compensate a party for certain damages or losses incurred during the execution of the Loan Documents.\"", "entity_type": "\"FINANCIAL TRANSACTION\"", "id": "\"INDEMNITY PAYMENTS\"", "label": "\"INDEMNITY PAYMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-ce242614e7c70072950823bb3955e36c", "title": "\"Payments made to compensate a party for certain damages or losses incurred during the execution of the Loan Documents.\""}, {"color": "#cfa48f", "description": "\"Total Credit Exposure represents the combination of a lender\u0027s unused commitment and revolving credit exposure.\"", "entity_type": "\"FINANCIAL METRIC\"", "id": "\"TOTAL CREDIT EXPOSURE\"", "label": "\"TOTAL CREDIT EXPOSURE\"", "shape": "dot", "size": 10, "source_id": "chunk-d66da8a55a9bfe53a234f03c63fcb1d0", "title": "\"Total Credit Exposure represents the combination of a lender\u0027s unused commitment and revolving credit exposure.\""}, {"color": "#87cca2", "description": "\"Refers to the total amount that is outstanding under the loan agreements and affects borrowing limits.\"\u003cSEP\u003e\"Total Outstandings denotes the total amount of all loans that are currently outstanding at any given time.\"\u003cSEP\u003e\"Total Outstandings represent the total amount of loans that remain unpaid by the Borrower.\"\u003cSEP\u003e\"the Total Outstandings refers to the total amount owed under all loans.\"", "entity_type": "\"FINANCIAL METRIC\"", "id": "\"TOTAL OUTSTANDINGS\"", "label": "\"TOTAL OUTSTANDINGS\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-d66da8a55a9bfe53a234f03c63fcb1d0", "title": "\"Refers to the total amount that is outstanding under the loan agreements and affects borrowing limits.\"\u003cSEP\u003e\"Total Outstandings denotes the total amount of all loans that are currently outstanding at any given time.\"\u003cSEP\u003e\"Total Outstandings represent the total amount of loans that remain unpaid by the Borrower.\"\u003cSEP\u003e\"the Total Outstandings refers to the total amount owed under all loans.\""}, {"color": "#eb2da9", "description": "\"\u0027Fee Letter\u0027 means the letter agreement dated September 19, 2023, between the Company and Citigroup Global Markets Inc.\"\u003cSEP\u003e\"The Fee Letter outlines additional fees payable to the Administrative Agent not covered in the primary agreement.\"\u003cSEP\u003e\"The Fee Letter outlines specific fees associated with the loan and may be amended or waived when agreed upon by the parties.\"", "entity_type": "\"AGREEMENT\"", "id": "\"FEE LETTER\"", "label": "\"FEE LETTER\"", "shape": "dot", "size": 10, "source_id": "chunk-6ab6e4615e53048f9d0e33ad97f0a57e\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Fee Letter\u0027 means the letter agreement dated September 19, 2023, between the Company and Citigroup Global Markets Inc.\"\u003cSEP\u003e\"The Fee Letter outlines additional fees payable to the Administrative Agent not covered in the primary agreement.\"\u003cSEP\u003e\"The Fee Letter outlines specific fees associated with the loan and may be amended or waived when agreed upon by the parties.\""}, {"color": "#9f1caf", "description": "\"\u0027Indemnitees\u0027 refers to the parties entitled to indemnification under the terms of the Agreement.\"", "entity_type": "\"LEGAL ENTITY\"", "id": "\"INDEMNITEES\"", "label": "\"INDEMNITEES\"", "shape": "dot", "size": 10, "source_id": "chunk-05b4cc5b2660656388ebad9cd016c596", "title": "\"\u0027Indemnitees\u0027 refers to the parties entitled to indemnification under the terms of the Agreement.\""}, {"color": "#da2250", "description": "\"\u0027Recipient\u0027 refers to a party that receives payments or financial benefits under the terms defined in the agreements.\"\u003cSEP\u003e\"The Recipient is the entity receiving payments that may be subject to tax deductions.\"\u003cSEP\u003e\"The entity receiving payments under the Loan Document, which may be subject to tax indemnification agreements with Borrowers.\"\u003cSEP\u003e\"the Administrative Agent, any Lender or any other recipient of any payment to be made by or on account of any obligation of any Borrower under any Loan Document.\"", "entity_type": "\"BORROWER\"", "id": "\"RECIPIENT\"", "label": "\"RECIPIENT\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Recipient\u0027 refers to a party that receives payments or financial benefits under the terms defined in the agreements.\"\u003cSEP\u003e\"The Recipient is the entity receiving payments that may be subject to tax deductions.\"\u003cSEP\u003e\"The entity receiving payments under the Loan Document, which may be subject to tax indemnification agreements with Borrowers.\"\u003cSEP\u003e\"the Administrative Agent, any Lender or any other recipient of any payment to be made by or on account of any obligation of any Borrower under any Loan Document.\""}, {"color": "#9127e0", "description": "\"Loans denominated in US Dollars may be Base Rate Loans, Term SOFR Loans or, if applicable pursuant to Section 3.03, Daily Simple SOFR Loans.\"\u003cSEP\u003e\"Loans whose interest rates are determined based on a base rate set by the lender.\"", "entity_type": "\"FACILITY\"", "id": "\"BASE RATE LOANS\"", "label": "\"BASE RATE LOANS\"", "shape": "dot", "size": 10, "source_id": "chunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521", "title": "\"Loans denominated in US Dollars may be Base Rate Loans, Term SOFR Loans or, if applicable pursuant to Section 3.03, Daily Simple SOFR Loans.\"\u003cSEP\u003e\"Loans whose interest rates are determined based on a base rate set by the lender.\""}, {"color": "#ca966b", "description": "\"Each borrowing of, conversion to or continuation of Term Benchmark Loans shall be made upon the applicable Borrower\u2019s irrevocable notice to the Administrative Agent.\"\u003cSEP\u003e\"Loans associated with a specified term and interest benchmark.\"\u003cSEP\u003e\"Loans that are determined based on a specific benchmark interest rate over a defined term.\"\u003cSEP\u003e\"Loans that are indexed to a benchmark rate for a specified term as outlined in the Loan Notice.\"\u003cSEP\u003e\"Term Benchmark Loans are financial loans that reference a specific benchmark interest rate.\"", "entity_type": "\"LOAN TYPE\"", "id": "\"TERM BENCHMARK LOANS\"", "label": "\"TERM BENCHMARK LOANS\"", "shape": "dot", "size": 10, "source_id": "chunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b", "title": "\"Each borrowing of, conversion to or continuation of Term Benchmark Loans shall be made upon the applicable Borrower\u2019s irrevocable notice to the Administrative Agent.\"\u003cSEP\u003e\"Loans associated with a specified term and interest benchmark.\"\u003cSEP\u003e\"Loans that are determined based on a specific benchmark interest rate over a defined term.\"\u003cSEP\u003e\"Loans that are indexed to a benchmark rate for a specified term as outlined in the Loan Notice.\"\u003cSEP\u003e\"Term Benchmark Loans are financial loans that reference a specific benchmark interest rate.\""}, {"color": "#46e4be", "description": "\"Any Loan or Borrowing denominated in US Dollars is explained with respect to Relevant Rate.\"\u003cSEP\u003e\"Payments by the Borrowers shall be made in US Dollars and in Same Day Funds not later than 4:00 p.m., New York City time.\"\u003cSEP\u003e\"the Borrowers may borrow in US Dollars or in one or more Alternative Currencies.\"", "entity_type": "\"CURRENCY\"", "id": "\"US DOLLARS\"", "label": "\"US DOLLARS\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-f4d032810167311fd685322e589a9173", "title": "\"Any Loan or Borrowing denominated in US Dollars is explained with respect to Relevant Rate.\"\u003cSEP\u003e\"Payments by the Borrowers shall be made in US Dollars and in Same Day Funds not later than 4:00 p.m., New York City time.\"\u003cSEP\u003e\"the Borrowers may borrow in US Dollars or in one or more Alternative Currencies.\""}, {"color": "#97dac6", "description": "\"the Borrowers may borrow in US Dollars or in one or more Alternative Currencies.\"", "entity_type": "\"CURRENCY\"", "id": "\"ALTERNATIVE CURRENCIES\"", "label": "\"ALTERNATIVE CURRENCIES\"", "shape": "dot", "size": 10, "source_id": "chunk-17156cdb19d248f88d4ee1e387dc4521", "title": "\"the Borrowers may borrow in US Dollars or in one or more Alternative Currencies.\""}, {"color": "#73743b", "description": "\"UK Resolution Authority refers to entities responsible for overseeing the resolution processes for UK Financial Institutions.\"", "entity_type": "\"AGENCY\"", "id": "\"UK RESOLUTION AUTHORITY\"", "label": "\"UK RESOLUTION AUTHORITY\"", "shape": "dot", "size": 10, "source_id": "chunk-d66da8a55a9bfe53a234f03c63fcb1d0", "title": "\"UK Resolution Authority refers to entities responsible for overseeing the resolution processes for UK Financial Institutions.\""}, {"color": "#b672b4", "description": "\"A situation when a Borrower fails to meet the legal obligations (or conditions) of a Loan, potentially affecting the Lender\u0027s rights.\"\u003cSEP\u003e\"Default refers to an event where the Borrower fails to meet the obligations set forth in the Loan Documents.\"\u003cSEP\u003e\"Default refers to the failure of the Company to meet the obligations defined in the Loan Document, which the Lender can enforce under specific conditions.\"\u003cSEP\u003e\"Default refers to the failure to meet the obligations stipulated in loan agreements between the Borrowers and Lenders.\"\u003cSEP\u003e\"Refers to a failure by the Borrower to meet the obligations outlined in the Loan Documents.\"\u003cSEP\u003e\"Refers to the occurrence of an event that impacts the obligations of the Company, prompting notification obligations to the Administrative Agent and Lender.\"", "entity_type": "\"EVENT\"", "id": "\"DEFAULT\"", "label": "\"DEFAULT\"", "shape": "dot", "size": 10, "source_id": "chunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-d4356ca46805b368884b787be8cbc403\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-ca3882e5c61b45ffe53e6ae54b7b7651\u003cSEP\u003echunk-56f074a2930435362e3f578a0827e759", "title": "\"A situation when a Borrower fails to meet the legal obligations (or conditions) of a Loan, potentially affecting the Lender\u0027s rights.\"\u003cSEP\u003e\"Default refers to an event where the Borrower fails to meet the obligations set forth in the Loan Documents.\"\u003cSEP\u003e\"Default refers to the failure of the Company to meet the obligations defined in the Loan Document, which the Lender can enforce under specific conditions.\"\u003cSEP\u003e\"Default refers to the failure to meet the obligations stipulated in loan agreements between the Borrowers and Lenders.\"\u003cSEP\u003e\"Refers to a failure by the Borrower to meet the obligations outlined in the Loan Documents.\"\u003cSEP\u003e\"Refers to the occurrence of an event that impacts the obligations of the Company, prompting notification obligations to the Administrative Agent and Lender.\""}, {"color": "#201361", "description": "\"Debtor Relief Law encompasses legal frameworks designed to protect debtors in financial distress, influencing actions related to default and loan management.\"\u003cSEP\u003e\"Debtor Relief Law includes regulations governing the relief options available to borrowers facing financial distress.\"\u003cSEP\u003e\"Laws governing the situation of borrowers facing financial distress or insolvency.\"\u003cSEP\u003e\"Laws that relate to legal proceedings involving Borrowers, particularly in cases of financial distress.\"\u003cSEP\u003e\"Laws under which a Borrower or any Material Subsidiary applies for or consents to the appointment of any receiver or similar officer.\"\u003cSEP\u003e\"The Debtor Relief Law governs the rights of borrowers under various circumstances, providing a legal framework for handling loans and defaults.\"\u003cSEP\u003e\"The category of laws that provide relief to debtors, affecting the actions and status of the Lender in the agreement.\"", "entity_type": "\"REGULATORY\"", "id": "\"DEBTOR RELIEF LAW\"", "label": "\"DEBTOR RELIEF LAW\"", "shape": "dot", "size": 10, "source_id": "chunk-8c4b020bf60daa77bdf0578ce86ca311\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-ca3882e5c61b45ffe53e6ae54b7b7651\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f\u003cSEP\u003echunk-56f074a2930435362e3f578a0827e759", "title": "\"Debtor Relief Law encompasses legal frameworks designed to protect debtors in financial distress, influencing actions related to default and loan management.\"\u003cSEP\u003e\"Debtor Relief Law includes regulations governing the relief options available to borrowers facing financial distress.\"\u003cSEP\u003e\"Laws governing the situation of borrowers facing financial distress or insolvency.\"\u003cSEP\u003e\"Laws that relate to legal proceedings involving Borrowers, particularly in cases of financial distress.\"\u003cSEP\u003e\"Laws under which a Borrower or any Material Subsidiary applies for or consents to the appointment of any receiver or similar officer.\"\u003cSEP\u003e\"The Debtor Relief Law governs the rights of borrowers under various circumstances, providing a legal framework for handling loans and defaults.\"\u003cSEP\u003e\"The category of laws that provide relief to debtors, affecting the actions and status of the Lender in the agreement.\""}, {"color": "#579d2a", "description": "\"A Credit Party refers to entities that have lent money or extended credit related to the Guaranty.\"", "entity_type": "\"LENDER\"", "id": "\"CREDIT PARTY\"", "label": "\"CREDIT PARTY\"", "shape": "dot", "size": 10, "source_id": "chunk-365109d2a10139b03b825bac3b05cc13", "title": "\"A Credit Party refers to entities that have lent money or extended credit related to the Guaranty.\""}, {"color": "#71a9ed", "description": "\"Liabilities or commitments that the Borrower must fulfill under the loan agreement.\"\u003cSEP\u003e\"Obligations owing to such Defaulting Lender as to which it exercised such right of setoff.\"\u003cSEP\u003e\"Obligations refer to the financial responsibilities and commitments that the Company must fulfill under the Guaranty.\"\u003cSEP\u003e\"Obligations refer to the responsibilities and financial commitments of Designated Borrowers as outlined in the Agreement.\"\u003cSEP\u003e\"Refers to all amounts due from the Borrowers to the Lenders under the Loan Documents, including principal and interest.\"\u003cSEP\u003e\"Refers to all debts and liabilities of the Borrower arising under the Loan Document.\"\u003cSEP\u003e\"The obligation of the Borrowers hereunder to pay any amount owing with respect to the Obligations is critical.\"\u003cSEP\u003e\"any amounts received on account of the Obligations shall be applied by the Administrative Agent.\"", "entity_type": "\"AGREEMENT\"", "id": "\"OBLIGATIONS\"", "label": "\"OBLIGATIONS\"", "shape": "dot", "size": 10, "source_id": "chunk-d4356ca46805b368884b787be8cbc403\u003cSEP\u003echunk-f4d032810167311fd685322e589a9173\u003cSEP\u003echunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-8c4b020bf60daa77bdf0578ce86ca311\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-365109d2a10139b03b825bac3b05cc13\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"Liabilities or commitments that the Borrower must fulfill under the loan agreement.\"\u003cSEP\u003e\"Obligations owing to such Defaulting Lender as to which it exercised such right of setoff.\"\u003cSEP\u003e\"Obligations refer to the financial responsibilities and commitments that the Company must fulfill under the Guaranty.\"\u003cSEP\u003e\"Obligations refer to the responsibilities and financial commitments of Designated Borrowers as outlined in the Agreement.\"\u003cSEP\u003e\"Refers to all amounts due from the Borrowers to the Lenders under the Loan Documents, including principal and interest.\"\u003cSEP\u003e\"Refers to all debts and liabilities of the Borrower arising under the Loan Document.\"\u003cSEP\u003e\"The obligation of the Borrowers hereunder to pay any amount owing with respect to the Obligations is critical.\"\u003cSEP\u003e\"any amounts received on account of the Obligations shall be applied by the Administrative Agent.\""}, {"color": "#7bbdfe", "description": "\"All payments by the Borrowers hereunder with respect to principal of and interest on Loans denominated in an Alternative Currency shall be made to the Administrative Agent.\"\u003cSEP\u003e\"Alternative Currency refers to any currency other than the primary currency (usually USD) used in the context of loans.\"\u003cSEP\u003e\"Any currency other than the US Dollar that may be involved in transactions, relevant for loan provisions.\"\u003cSEP\u003e\"Any currency other than the primary currency used in the agreement, for loan transactions.\"\u003cSEP\u003e\"Currencies other than the primary currency used for loan transactions in the interbank market.\"\u003cSEP\u003e\"Refers to any currency used in addition to US Dollars for the purpose of loan transactions.\"\u003cSEP\u003e\"any currency other than US Dollars that may be specified in financial arrangements.\"\u003cSEP\u003e\"currencies approved in accordance with Section 1.05, other than US Dollars.\"", "entity_type": "\"CURRENCY\"", "id": "\"ALTERNATIVE CURRENCY\"", "label": "\"ALTERNATIVE CURRENCY\"", "shape": "dot", "size": 10, "source_id": "chunk-f3f17cf7a579171d338315f7798375fb\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-f4d032810167311fd685322e589a9173\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f", "title": "\"All payments by the Borrowers hereunder with respect to principal of and interest on Loans denominated in an Alternative Currency shall be made to the Administrative Agent.\"\u003cSEP\u003e\"Alternative Currency refers to any currency other than the primary currency (usually USD) used in the context of loans.\"\u003cSEP\u003e\"Any currency other than the US Dollar that may be involved in transactions, relevant for loan provisions.\"\u003cSEP\u003e\"Any currency other than the primary currency used in the agreement, for loan transactions.\"\u003cSEP\u003e\"Currencies other than the primary currency used for loan transactions in the interbank market.\"\u003cSEP\u003e\"Refers to any currency used in addition to US Dollars for the purpose of loan transactions.\"\u003cSEP\u003e\"any currency other than US Dollars that may be specified in financial arrangements.\"\u003cSEP\u003e\"currencies approved in accordance with Section 1.05, other than US Dollars.\""}, {"color": "#fb2292", "description": "\"Commitments indicate the agreed-upon amounts that Credit Parties are willing to lend under the Guaranty.\"\u003cSEP\u003e\"Commitments refer to the obligations of Lenders to provide Loans to Borrowers under the Loan Agreement.\"\u003cSEP\u003e\"Promises made by lenders to provide funds to borrowers under specified conditions.\"", "entity_type": "\"AGREEMENT\"", "id": "\"COMMITMENTS\"", "label": "\"COMMITMENTS\"", "shape": "dot", "size": 10, "source_id": "chunk-7eb7b5bc404a25d999aedbc8e6f0cac4\u003cSEP\u003echunk-365109d2a10139b03b825bac3b05cc13\u003cSEP\u003echunk-024104f61867a710efed88937d20b566", "title": "\"Commitments indicate the agreed-upon amounts that Credit Parties are willing to lend under the Guaranty.\"\u003cSEP\u003e\"Commitments refer to the obligations of Lenders to provide Loans to Borrowers under the Loan Agreement.\"\u003cSEP\u003e\"Promises made by lenders to provide funds to borrowers under specified conditions.\""}, {"color": "#8cebf9", "description": "\"Outstanding Amount refers to the total amount of money that is still owed to Lenders as per the agreement.\"\u003cSEP\u003e\"the sum of the US Dollar Equivalents of the outstanding principal amount of such Loans after giving effect to any borrowings and prepayments or repayments of such Loans occurring on such date.\"", "entity_type": "\"DEFINITION\"", "id": "\"OUTSTANDING AMOUNT\"", "label": "\"OUTSTANDING AMOUNT\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa", "title": "\"Outstanding Amount refers to the total amount of money that is still owed to Lenders as per the agreement.\"\u003cSEP\u003e\"the sum of the US Dollar Equivalents of the outstanding principal amount of such Loans after giving effect to any borrowings and prepayments or repayments of such Loans occurring on such date.\""}, {"color": "#d91165", "description": "\"Law pertains to the legal framework within which the Guaranty is governed and construed.\"", "entity_type": "\"REGULATORY\"", "id": "\"LAW\"", "label": "\"LAW\"", "shape": "dot", "size": 10, "source_id": "chunk-365109d2a10139b03b825bac3b05cc13", "title": "\"Law pertains to the legal framework within which the Guaranty is governed and construed.\""}, {"color": "#cd5859", "description": "\"Guaranty means the Guarantee of the Obligations of the Designated Borrowers made by the Company in favor of the Credit Parties under Article X.\"\u003cSEP\u003e\"The Guaranty outlines the responsibilities and obligations of the Company with respect to the Guarantee Obligations.\"\u003cSEP\u003e\"The Obligations of each Designated Borrower shall be guaranteed by the Company pursuant to the Guaranty contained in Article X.\"", "entity_type": "\"AGREEMENT\"", "id": "\"GUARANTY\"", "label": "\"GUARANTY\"", "shape": "dot", "size": 10, "source_id": "chunk-5f3e48899c511bd9c1507e3c0453d886\u003cSEP\u003echunk-365109d2a10139b03b825bac3b05cc13\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024", "title": "\"Guaranty means the Guarantee of the Obligations of the Designated Borrowers made by the Company in favor of the Credit Parties under Article X.\"\u003cSEP\u003e\"The Guaranty outlines the responsibilities and obligations of the Company with respect to the Guarantee Obligations.\"\u003cSEP\u003e\"The Obligations of each Designated Borrower shall be guaranteed by the Company pursuant to the Guaranty contained in Article X.\""}, {"color": "#7a4721", "description": "\"Applicant Borrower is a Subsidiary of the Company that can be designated to receive Loans under this Agreement after meeting specific requirements.\"", "entity_type": "\"BORROWER\"", "id": "\"APPLICANT BORROWER\"", "label": "\"APPLICANT BORROWER\"", "shape": "dot", "size": 10, "source_id": "chunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"Applicant Borrower is a Subsidiary of the Company that can be designated to receive Loans under this Agreement after meeting specific requirements.\""}, {"color": "#e96755", "description": "\"Information required with respect to the Agreement by regulatory authorities under applicable anti-money laundering rules and regulations.\"\u003cSEP\u003e\"Information that Borrowers must provide to ensure compliance with laws and regulations, including anti-money laundering rules.\"\u003cSEP\u003e\"Information that may be required by lenders to comply with regulations prior to the closing date.\"", "entity_type": "\"REGULATORY\"", "id": "\"REGULATORY INFORMATION\"", "label": "\"REGULATORY INFORMATION\"", "shape": "dot", "size": 10, "source_id": "chunk-681a8d93f2ef85ce7c68923bd55d27e4\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"Information required with respect to the Agreement by regulatory authorities under applicable anti-money laundering rules and regulations.\"\u003cSEP\u003e\"Information that Borrowers must provide to ensure compliance with laws and regulations, including anti-money laundering rules.\"\u003cSEP\u003e\"Information that may be required by lenders to comply with regulations prior to the closing date.\""}, {"color": "#60e960", "description": "\"Section 11.01 outlines the specific restrictions related to the Lender\u2019s rights to approve amendments, waivers, or consents.\"", "entity_type": "\"AGREEMENT\"", "id": "\"SECTION 11.01\"", "label": "\"SECTION 11.01\"", "shape": "dot", "size": 10, "source_id": "chunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"Section 11.01 outlines the specific restrictions related to the Lender\u2019s rights to approve amendments, waivers, or consents.\""}, {"color": "#529c9b", "description": "\"Article VIII outlines payment handling for Defaulting Lenders.\"", "entity_type": "\"AGREEMENT\"", "id": "\"ARTICLE VIII\"", "label": "\"ARTICLE VIII\"", "shape": "dot", "size": 10, "source_id": "chunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"Article VIII outlines payment handling for Defaulting Lenders.\""}, {"color": "#65a17a", "description": "\"\u0027Defaulting Lender\u0027 means, subject to Section 2.13(b), any Lender that...\"\u003cSEP\u003e\"A Defaulting Lender is a lender that has failed to fulfill obligations as outlined in the Loan Documents, thereby affecting the lending agreement.\"\u003cSEP\u003e\"A Defaulting Lender is a lender that has failed to fulfill their obligations under a loan agreement.\"\u003cSEP\u003e\"A Defaulting Lender\u0027s Total Credit Exposure shall be disregarded in determining Required Lenders at any time.\"\u003cSEP\u003e\"A Lender that has failed to meet its obligations under the terms of the Loan Documents, possibly affecting the dynamics of the lending agreement.\"\u003cSEP\u003e\"A Lender who fails to meet their obligations or terms as defined in the Loan Documents.\"\u003cSEP\u003e\"A lender that has failed to meet its financial obligations or requirements as stipulated in the agreements.\"\u003cSEP\u003e\"A lender that has failed to meet its funding obligations as specified in the loan agreement, indicating noncompliance with terms.\"\u003cSEP\u003e\"A lender that has failed to meet its obligations under the terms of the loan agreement.\"\u003cSEP\u003e\"Any Lender that shall exercise any right of setoff against the Company or Borrower, as provided in the Agreement.\"\u003cSEP\u003e\"Defaulting Lender is defined as a Lender that has failed to fund its portion of the Loans and has specific consequences outlined in the agreement.\"\u003cSEP\u003e\"Defaulting Lender refers to any Lender who is unable to fulfill their obligations, lacking the right to approve amendments or waivers u
