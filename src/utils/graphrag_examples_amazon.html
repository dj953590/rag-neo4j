escription": "\"Any additional taxes incurred during transactions unrelated to loan execution or delivery.\"\u003cSEP\u003e\"Other Taxes are those which do not fall under Excluded Taxes but are imposed on or with regard to payments made under the Loan Documents.\"\u003cSEP\u003e\"all present or future stamp, court or documentary, intangible, recording, filing or similar Taxes that arise from any payment made under the loan documents.\"", "entity_type": "\"AGREEMENT\"", "id": "\"OTHER TAXES\"", "label": "\"OTHER TAXES\"", "shape": "dot", "size": 10, "source_id": "chunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024", "title": "\"Any additional taxes incurred during transactions unrelated to loan execution or delivery.\"\u003cSEP\u003e\"Other Taxes are those which do not fall under Excluded Taxes but are imposed on or with regard to payments made under the Loan Documents.\"\u003cSEP\u003e\"all present or future stamp, court or documentary, intangible, recording, filing or similar Taxes that arise from any payment made under the loan documents.\""}, {"color": "#21d0ee", "description": "\"\u0027Governmental Authority\u0027 means the government of the United States or any other nation.\"\u003cSEP\u003e\"An authority that determines and enforces applicable laws related to tax compliance and lending.\"\u003cSEP\u003e\"An official body with the power to govern, manage, or regulate aspects related to the loans or entities.\"\u003cSEP\u003e\"Any government entity that may influence or regulate the functions or compliance of financial institutions involved in the agreement.\"\u003cSEP\u003e\"Any governmental body that issues laws or regulations relevant to the agreement.\"\u003cSEP\u003e\"Governmental Authorities are bodies that impose taxes that the Borrowers may need to withhold or remit under applicable laws.\"\u003cSEP\u003e\"Refers to the authorities that govern and regulate the Borrower\u2019s operations and compliance.\"\u003cSEP\u003e\"any authority established by the government to enforce laws or regulations.\"\u003cSEP\u003e\"claims, liabilities, penalties, interest and reasonable expenses arising from the relevant Governmental Authority...\"", "entity_type": "\"REGULATORY\"", "id": "\"GOVERNMENTAL AUTHORITY\"", "label": "\"GOVERNMENTAL AUTHORITY\"", "shape": "dot", "size": 10, "source_id": "chunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f", "title": "\"\u0027Governmental Authority\u0027 means the government of the United States or any other nation.\"\u003cSEP\u003e\"An authority that determines and enforces applicable laws related to tax compliance and lending.\"\u003cSEP\u003e\"An official body with the power to govern, manage, or regulate aspects related to the loans or entities.\"\u003cSEP\u003e\"Any government entity that may influence or regulate the functions or compliance of financial institutions involved in the agreement.\"\u003cSEP\u003e\"Any governmental body that issues laws or regulations relevant to the agreement.\"\u003cSEP\u003e\"Governmental Authorities are bodies that impose taxes that the Borrowers may need to withhold or remit under applicable laws.\"\u003cSEP\u003e\"Refers to the authorities that govern and regulate the Borrower\u2019s operations and compliance.\"\u003cSEP\u003e\"any authority established by the government to enforce laws or regulations.\"\u003cSEP\u003e\"claims, liabilities, penalties, interest and reasonable expenses arising from the relevant Governmental Authority...\""}, {"color": "#955418", "description": "\"Refers to information that is shared among parties which may include material non-public information (MNPI).\"", "entity_type": "\"AGREEMENT\"", "id": "\"NON-PUBLIC INFORMATION\"", "label": "\"NON-PUBLIC INFORMATION\"", "shape": "dot", "size": 10, "source_id": "chunk-681a8d93f2ef85ce7c68923bd55d27e4", "title": "\"Refers to information that is shared among parties which may include material non-public information (MNPI).\""}, {"color": "#ce6b6f", "description": "\"A benchmark interest rate for Australian dollar bank bills used to set borrowing costs.\"\u003cSEP\u003e\"An Australian benchmark used for financial transactions and agreements.\"\u003cSEP\u003e\"The AUD Bank Bill Rate pertains to Loans or Borrowings denominated in Australian Dollars.\"\u003cSEP\u003e\"The Australian Bank Bill Rate used in pricing loans denominated in Australian dollars.\"\u003cSEP\u003e\"means, with respect to any Term Benchmark Borrowing denominated in Australian Dollars for any Interest Period, the AUD Screen Rate at approximately 11:00 a.m., Sydney time, on the first day of such Interest Period.\"\u003cSEP\u003e\"the rate for Australian dollar-denominated loans.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"AUD BANK BILL RATE\"", "label": "\"AUD BANK BILL RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85", "title": "\"A benchmark interest rate for Australian dollar bank bills used to set borrowing costs.\"\u003cSEP\u003e\"An Australian benchmark used for financial transactions and agreements.\"\u003cSEP\u003e\"The AUD Bank Bill Rate pertains to Loans or Borrowings denominated in Australian Dollars.\"\u003cSEP\u003e\"The Australian Bank Bill Rate used in pricing loans denominated in Australian dollars.\"\u003cSEP\u003e\"means, with respect to any Term Benchmark Borrowing denominated in Australian Dollars for any Interest Period, the AUD Screen Rate at approximately 11:00 a.m., Sydney time, on the first day of such Interest Period.\"\u003cSEP\u003e\"the rate for Australian dollar-denominated loans.\""}, {"color": "#db7b4b", "description": "\"means a rate per annum equal to the average bid reference rate administered by ASX Benchmark Pty Limited (ACN 616 075 417) for bills of exchange in Australian Dollars.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"AUD SCREEN RATE\"", "label": "\"AUD SCREEN RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-213102e52aa6edea98697876f4c7a539", "title": "\"means a rate per annum equal to the average bid reference rate administered by ASX Benchmark Pty Limited (ACN 616 075 417) for bills of exchange in Australian Dollars.\""}, {"color": "#cee7ed", "description": "\"A Change in Law refers to any legal modification which may affect the obligations or costs associated with loans or agreements.\"\u003cSEP\u003e\"Refers to any new laws or changes in existing laws that affect the agreement.\"", "entity_type": "\"REGULATORY\"", "id": "\"CHANGE IN LAW\"", "label": "\"CHANGE IN LAW\"", "shape": "dot", "size": 10, "source_id": "chunk-1a887c72da47ff4eea9f79e69a645a7b\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803", "title": "\"A Change in Law refers to any legal modification which may affect the obligations or costs associated with loans or agreements.\"\u003cSEP\u003e\"Refers to any new laws or changes in existing laws that affect the agreement.\""}, {"color": "#e207bd", "description": "\"Debt obligations that arise within a corporate group, between parent companies and their subsidiaries.\"", "entity_type": "\"OBLIGATION\"", "id": "\"INTERCOMPANY INDEBTEDNESS\"", "label": "\"INTERCOMPANY INDEBTEDNESS\"", "shape": "dot", "size": 10, "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"Debt obligations that arise within a corporate group, between parent companies and their subsidiaries.\""}, {"color": "#db8368", "description": "\"An authorized representative of the Borrower who is responsible for executing loan documents.\"\u003cSEP\u003e\"An officer of the company responsible for certifying the conditions of the extension request.\"\u003cSEP\u003e\"Responsible Officer denotes the authorized personnel in charge of delivering specific certifications by a Borrower.\"\u003cSEP\u003e\"Responsible Officer refers to designated executives who are accountable for compliance and notifications in case of a Default occurring.\"", "entity_type": "\"AGENT\"", "id": "\"RESPONSIBLE OFFICER\"", "label": "\"RESPONSIBLE OFFICER\"", "shape": "dot", "size": 10, "source_id": "chunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-63dba9e522714ac0a8717c04f114cbd9", "title": "\"An authorized representative of the Borrower who is responsible for executing loan documents.\"\u003cSEP\u003e\"An officer of the company responsible for certifying the conditions of the extension request.\"\u003cSEP\u003e\"Responsible Officer denotes the authorized personnel in charge of delivering specific certifications by a Borrower.\"\u003cSEP\u003e\"Responsible Officer refers to designated executives who are accountable for compliance and notifications in case of a Default occurring.\""}, {"color": "#daf9d9", "description": "\"Digital representations of signatures that are deemed legally binding as per applicable laws.\"", "entity_type": "\"AGREEMENT\"", "id": "\"ELECTRONIC SIGNATURES\"", "label": "\"ELECTRONIC SIGNATURES\"", "shape": "dot", "size": 10, "source_id": "chunk-681a8d93f2ef85ce7c68923bd55d27e4", "title": "\"Digital representations of signatures that are deemed legally binding as per applicable laws.\""}, {"color": "#27e231", "description": "\"An interest rate for loans that banks use to borrow from one another overnight, used as a reference for lending.\"\u003cSEP\u003e\"the rate comprised of both overnight federal funds and overnight eurodollar transactions denominated in US Dollars by U.S.-managed banking offices of depository institutions.\"", "entity_type": "\"BASE RATE BENCHMARK\"", "id": "\"OVERNIGHT BANK FUNDING RATE\"", "label": "\"OVERNIGHT BANK FUNDING RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01", "title": "\"An interest rate for loans that banks use to borrow from one another overnight, used as a reference for lending.\"\u003cSEP\u003e\"the rate comprised of both overnight federal funds and overnight eurodollar transactions denominated in US Dollars by U.S.-managed banking offices of depository institutions.\""}, {"color": "#2080e3", "description": "\"An interest rate that is applied to the amount returned by the Lender to the Administrative Agent in the case of an erroneous payment.\"\u003cSEP\u003e\"The interest calculated for certain payments that need to be made on Borrowings is termed the Overnight Rate.\"\u003cSEP\u003e\"The interest rate for overnight loans, which influences the returns on any erroneous Payments that must be repaid by the Lenders.\"\u003cSEP\u003e\"the rate applicable for any day, with specific definitions for amounts denominated in US Dollars and Alternative Currency.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"OVERNIGHT RATE\"", "label": "\"OVERNIGHT RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-ce242614e7c70072950823bb3955e36c\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941\u003cSEP\u003echunk-f4d032810167311fd685322e589a9173", "title": "\"An interest rate that is applied to the amount returned by the Lender to the Administrative Agent in the case of an erroneous payment.\"\u003cSEP\u003e\"The interest calculated for certain payments that need to be made on Borrowings is termed the Overnight Rate.\"\u003cSEP\u003e\"The interest rate for overnight loans, which influences the returns on any erroneous Payments that must be repaid by the Lenders.\"\u003cSEP\u003e\"the rate applicable for any day, with specific definitions for amounts denominated in US Dollars and Alternative Currency.\""}, {"color": "#bda877", "description": "\"\u0027Base Rate\u0027 is a benchmark interest rate used to determine the interest on loans.\"\u003cSEP\u003e\"The Base Rate is a reference rate used to calculate interest on various loans.\"\u003cSEP\u003e\"The minimum rate that serves as the foundation for calculating interest charges.\"\u003cSEP\u003e\"means, for any day, a rate per annum equal to the highest of (a) the NYFRB Rate in effect on such day plus 1/2 of 1.00% per annum, (b) the Prime Rate in effect on such day, and (c) the Term SOFR for a one month Interest Period.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"BASE RATE\"", "label": "\"BASE RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-05b4cc5b2660656388ebad9cd016c596", "title": "\"\u0027Base Rate\u0027 is a benchmark interest rate used to determine the interest on loans.\"\u003cSEP\u003e\"The Base Rate is a reference rate used to calculate interest on various loans.\"\u003cSEP\u003e\"The minimum rate that serves as the foundation for calculating interest charges.\"\u003cSEP\u003e\"means, for any day, a rate per annum equal to the highest of (a) the NYFRB Rate in effect on such day plus 1/2 of 1.00% per annum, (b) the Prime Rate in effect on such day, and (c) the Term SOFR for a one month Interest Period.\""}, {"color": "#a11d64", "description": "\"the interest rate applicable to loans based on the Base Rate.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"APPLICABLE RATE FOR BASE RATE LOANS\"", "label": "\"APPLICABLE RATE FOR BASE RATE LOANS\"", "shape": "dot", "size": 10, "source_id": "chunk-213102e52aa6edea98697876f4c7a539", "title": "\"the interest rate applicable to loans based on the Base Rate.\""}, {"color": "#ddd674", "description": "\"\u0027Applicable Rate\u0027 refers to the interest rate that applies under specific loan terms.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"APPLICABLE RATE\"", "label": "\"APPLICABLE RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-05b4cc5b2660656388ebad9cd016c596", "title": "\"\u0027Applicable Rate\u0027 refers to the interest rate that applies under specific loan terms.\""}, {"color": "#ad91d0", "description": "\"Refers to the U.S. Internal Revenue Code of 1986.\"\u003cSEP\u003e\"The Code refers to the legal framework governing tax withholding and deductions relevant to payments made under the Loan Document.\"", "entity_type": "\"REGULATORY\"", "id": "\"CODE\"", "label": "\"CODE\"", "shape": "dot", "size": 10, "source_id": "chunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803", "title": "\"Refers to the U.S. Internal Revenue Code of 1986.\"\u003cSEP\u003e\"The Code refers to the legal framework governing tax withholding and deductions relevant to payments made under the Loan Document.\""}, {"color": "#17b0f5", "description": "\"Refers to the Total Credit Exposures representing more than 50% of the Total Credit Exposures of all Lenders.\"", "entity_type": "\"AGREEMENT\"", "id": "\"TOTAL CREDIT EXPOSURES\"", "label": "\"TOTAL CREDIT EXPOSURES\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"Refers to the Total Credit Exposures representing more than 50% of the Total Credit Exposures of all Lenders.\""}, {"color": "#5344d6", "description": "\"the interest rate applicable to loans based on Term SOFR.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"APPLICABLE RATE FOR TERM SOFR LOANS\"", "label": "\"APPLICABLE RATE FOR TERM SOFR LOANS\"", "shape": "dot", "size": 10, "source_id": "chunk-213102e52aa6edea98697876f4c7a539", "title": "\"the interest rate applicable to loans based on Term SOFR.\""}, {"color": "#602e03", "description": "\"\u0027Commitment\u0027 refers to the lender\u0027s promise to provide a certain amount of capital as specified in agreements.\"\u003cSEP\u003e\"Refers to the lender\u0027s obligation to provide funds to the borrower as specified in the loan agreement.\"\u003cSEP\u003e\"The Commitment of each Lender can be declared terminated if an Event of Default occurs.\"\u003cSEP\u003e\"The obligation of each Lender to provide loans to Borrowers under Section 2.01.\"\u003cSEP\u003e\"The total amount of loans that a lender agrees to provide to the borrower, subject to certain conditions and terms.\"", "entity_type": "\"AGREEMENT\"", "id": "\"COMMITMENT\"", "label": "\"COMMITMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-8c4b020bf60daa77bdf0578ce86ca311\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f", "title": "\"\u0027Commitment\u0027 refers to the lender\u0027s promise to provide a certain amount of capital as specified in agreements.\"\u003cSEP\u003e\"Refers to the lender\u0027s obligation to provide funds to the borrower as specified in the loan agreement.\"\u003cSEP\u003e\"The Commitment of each Lender can be declared terminated if an Event of Default occurs.\"\u003cSEP\u003e\"The obligation of each Lender to provide loans to Borrowers under Section 2.01.\"\u003cSEP\u003e\"The total amount of loans that a lender agrees to provide to the borrower, subject to certain conditions and terms.\""}, {"color": "#8fb82f", "description": "\"A Bail-In Action is a regulatory measure that involves converting unsecured liabilities of an Affected Financial Institution.\"\u003cSEP\u003e\"Actions taken under certain conditions to impose losses on lenders to support a failing financial institution.\"\u003cSEP\u003e\"means the exercise of any Write-Down and Conversion Powers by the applicable Resolution Authority in respect of any liability of any Affected Financial Institution.\"", "entity_type": "\"AGREEMENT\"", "id": "\"BAIL-IN ACTION\"", "label": "\"BAIL-IN ACTION\"", "shape": "dot", "size": 10, "source_id": "chunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f\u003cSEP\u003echunk-024104f61867a710efed88937d20b566", "title": "\"A Bail-In Action is a regulatory measure that involves converting unsecured liabilities of an Affected Financial Institution.\"\u003cSEP\u003e\"Actions taken under certain conditions to impose losses on lenders to support a failing financial institution.\"\u003cSEP\u003e\"means the exercise of any Write-Down and Conversion Powers by the applicable Resolution Authority in respect of any liability of any Affected Financial Institution.\""}, {"color": "#c740bd", "description": "\"\u0027Revolving Credit Exposure\u0027 refers to the amount that a Lender is willing to lend to Borrowers at any one time.\"\u003cSEP\u003e\"Refers to the risk exposure that a Lender has towards its revolving credit facility to the Borrowers.\"\u003cSEP\u003e\"The amount of credit available to a borrower under a revolving credit agreement.\"\u003cSEP\u003e\"the Revolving Credit Exposure of any Lender shall not exceed such Lender\u2019s Commitment.\"\u003cSEP\u003e\"the amount of credit being used by a borrower under a revolving credit facility.\"", "entity_type": "\"FINANCIAL TERM\"", "id": "\"REVOLVING CREDIT EXPOSURE\"", "label": "\"REVOLVING CREDIT EXPOSURE\"", "shape": "dot", "size": 10, "source_id": "chunk-05b4cc5b2660656388ebad9cd016c596\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803", "title": "\"\u0027Revolving Credit Exposure\u0027 refers to the amount that a Lender is willing to lend to Borrowers at any one time.\"\u003cSEP\u003e\"Refers to the risk exposure that a Lender has towards its revolving credit facility to the Borrowers.\"\u003cSEP\u003e\"The amount of credit available to a borrower under a revolving credit agreement.\"\u003cSEP\u003e\"the Revolving Credit Exposure of any Lender shall not exceed such Lender\u2019s Commitment.\"\u003cSEP\u003e\"the amount of credit being used by a borrower under a revolving credit facility.\""}, {"color": "#a783f7", "description": "\"The Resolution Authority holds the power to execute bail-in actions pertaining to failing financial institutions.\"", "entity_type": "\"AGENCY\"", "id": "\"RESOLUTION AUTHORITY\"", "label": "\"RESOLUTION AUTHORITY\"", "shape": "dot", "size": 10, "source_id": "chunk-024104f61867a710efed88937d20b566", "title": "\"The Resolution Authority holds the power to execute bail-in actions pertaining to failing financial institutions.\""}, {"color": "#38ebe7", "description": "\"\u0027Event of Default\u0027 has the meaning specified in Section 8.01.\"\u003cSEP\u003e\"A condition defined in the Agreement that allows a Lender to set off against the Company\u0027s obligations.\"\u003cSEP\u003e\"A specific condition that triggers a breach of agreement, allowing the lender to take remaining rights or actions.\"\u003cSEP\u003e\"An Event of Default is a situation defined in loan agreements that allows the lender to demand immediate repayment of the outstanding loan.\"\u003cSEP\u003e\"An Event of Default occurs when any Borrower fails to perform or observe any terms, covenants, or agreements defined in the Loan Document.\"", "entity_type": "\"AGREEMENT\"", "id": "\"EVENT OF DEFAULT\"", "label": "\"EVENT OF DEFAULT\"", "shape": "dot", "size": 10, "source_id": "chunk-cd612893d5a0225fd778ba086853009a\u003cSEP\u003echunk-8c4b020bf60daa77bdf0578ce86ca311\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f", "title": "\"\u0027Event of Default\u0027 has the meaning specified in Section 8.01.\"\u003cSEP\u003e\"A condition defined in the Agreement that allows a Lender to set off against the Company\u0027s obligations.\"\u003cSEP\u003e\"A specific condition that triggers a breach of agreement, allowing the lender to take remaining rights or actions.\"\u003cSEP\u003e\"An Event of Default is a situation defined in loan agreements that allows the lender to demand immediate repayment of the outstanding loan.\"\u003cSEP\u003e\"An Event of Default occurs when any Borrower fails to perform or observe any terms, covenants, or agreements defined in the Loan Document.\""}, {"color": "#d4ed8c", "description": "\"Availability Period is the timeframe during which the Borrower can draw on the loans from the Lenders.\"\u003cSEP\u003e\"the Borrowers may borrow from time to time during the Availability Period.\"\u003cSEP\u003e\"the period from and including the Closing Date to the earliest of (a) the Maturity Date and (b) the date of termination of the Aggregate Commitments.\"", "entity_type": "\"AGREEMENT\"", "id": "\"AVAILABILITY PERIOD\"", "label": "\"AVAILABILITY PERIOD\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521", "title": "\"Availability Period is the timeframe during which the Borrower can draw on the loans from the Lenders.\"\u003cSEP\u003e\"the Borrowers may borrow from time to time during the Availability Period.\"\u003cSEP\u003e\"the period from and including the Closing Date to the earliest of (a) the Maturity Date and (b) the date of termination of the Aggregate Commitments.\""}, {"color": "#cb60ea", "description": "\"Each borrowing of, conversion to or continuation of loans must not be less than the Borrowing Minimum.\"\u003cSEP\u003e\"The minimum amount required for different types of Borrowings as specified in the agreement.\"", "entity_type": "\"FINANCIAL TERM\"", "id": "\"BORROWING MINIMUM\"", "label": "\"BORROWING MINIMUM\"", "shape": "dot", "size": 10, "source_id": "chunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803", "title": "\"Each borrowing of, conversion to or continuation of loans must not be less than the Borrowing Minimum.\"\u003cSEP\u003e\"The minimum amount required for different types of Borrowings as specified in the agreement.\""}, {"color": "#71c9e8", "description": "\"\u0027Excluded Taxes\u0027 means any Taxes imposed on or with respect to any Recipient or required to be withheld or deducted from a payment to a Recipient.\"\u003cSEP\u003e\"Excluded Taxes are specific categories of taxes that may be applicable under certain conditions outlined in the Loan Document.\"\u003cSEP\u003e\"Excluded Taxes attributable to such Lender that are payable or paid by the Administrative Agent or such Borrower in connection with any Loan Document...\"\u003cSEP\u003e\"Excluded Taxes refers to any taxes not covered under the standard obligations of the Borrowers.\"\u003cSEP\u003e\"Taxes that are not included in Other Taxes specified in the loan documents.\"", "entity_type": "\"AGREEMENT\"", "id": "\"EXCLUDED TAXES\"", "label": "\"EXCLUDED TAXES\"", "shape": "dot", "size": 10, "source_id": "chunk-d66ae22c28cd0d84aa869af9d7f2a233\u003cSEP\u003echunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Excluded Taxes\u0027 means any Taxes imposed on or with respect to any Recipient or required to be withheld or deducted from a payment to a Recipient.\"\u003cSEP\u003e\"Excluded Taxes are specific categories of taxes that may be applicable under certain conditions outlined in the Loan Document.\"\u003cSEP\u003e\"Excluded Taxes attributable to such Lender that are payable or paid by the Administrative Agent or such Borrower in connection with any Loan Document...\"\u003cSEP\u003e\"Excluded Taxes refers to any taxes not covered under the standard obligations of the Borrowers.\"\u003cSEP\u003e\"Taxes that are not included in Other Taxes specified in the loan documents.\""}, {"color": "#dbff96", "description": "\"\u0027FATCA\u0027 means Sections 1471 through 1474 of the Code, as of the date of this Agreement.\"\u003cSEP\u003e\"The Foreign Account Tax Compliance Act, which requires the documentation and compliance for tax withholding by lenders.\"\u003cSEP\u003e\"if a payment made to a Lender under any Loan Document would be subject to U.S. federal withholding Tax imposed by FATCA...\"", "entity_type": "\"REGULATORY\"", "id": "\"FATCA\"", "label": "\"FATCA\"", "shape": "dot", "size": 10, "source_id": "chunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-abf0317bfac3ae865c4d243bfc139471\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027FATCA\u0027 means Sections 1471 through 1474 of the Code, as of the date of this Agreement.\"\u003cSEP\u003e\"The Foreign Account Tax Compliance Act, which requires the documentation and compliance for tax withholding by lenders.\"\u003cSEP\u003e\"if a payment made to a Lender under any Loan Document would be subject to U.S. federal withholding Tax imposed by FATCA...\""}, {"color": "#17a32c", "description": "\"Refers to governmental financial or trade restrictions that the Company and its subsidiaries must adhere to.\"\u003cSEP\u003e\"Restrictive measures imposed by governments or international bodies to achieve foreign policy or national security goals.\"\u003cSEP\u003e\"Sanctions are measures imposed on individuals or entities which the Borrowers must be compliant with according to regulations enforced by government entities.\"", "entity_type": "\"REGULATORY\"", "id": "\"SANCTIONS\"", "label": "\"SANCTIONS\"", "shape": "dot", "size": 10, "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8\u003cSEP\u003echunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d", "title": "\"Refers to governmental financial or trade restrictions that the Company and its subsidiaries must adhere to.\"\u003cSEP\u003e\"Restrictive measures imposed by governments or international bodies to achieve foreign policy or national security goals.\"\u003cSEP\u003e\"Sanctions are measures imposed on individuals or entities which the Borrowers must be compliant with according to regulations enforced by government entities.\""}, {"color": "#28733b", "description": "\"Persons involved in transactions must comply with applicable Sanctions laws.\"", "entity_type": "\"UNKNOWN\"", "id": "\"PERSONS\"", "label": "\"PERSONS\"", "shape": "dot", "size": 10, "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"Persons involved in transactions must comply with applicable Sanctions laws.\""}, {"color": "#9aba10", "description": "\"The Bank of Canada or a committee officially endorsed or convened by the Bank of Canada.\"", "entity_type": "\"CORPORATION\"", "id": "\"BANK OF CANADA\"", "label": "\"BANK OF CANADA\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"The Bank of Canada or a committee officially endorsed or convened by the Bank of Canada.\""}, {"color": "#2559fe", "description": "\"An event that signifies a change or a shift in the benchmarking standard used in loan agreements.\"\u003cSEP\u003e\"An occurrence that indicates a change in the benchmark rates used for borrowing agreements, which may require adjustments in loan terms.\"\u003cSEP\u003e\"an occurrence that triggers the replacement of a current Benchmark with a new Benchmark.\"", "entity_type": "\"AGREEMENT\"", "id": "\"BENCHMARK TRANSITION EVENT\"", "label": "\"BENCHMARK TRANSITION EVENT\"", "shape": "dot", "size": 10, "source_id": "chunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-213102e52aa6edea98697876f4c7a539", "title": "\"An event that signifies a change or a shift in the benchmarking standard used in loan agreements.\"\u003cSEP\u003e\"An occurrence that indicates a change in the benchmark rates used for borrowing agreements, which may require adjustments in loan terms.\"\u003cSEP\u003e\"an occurrence that triggers the replacement of a current Benchmark with a new Benchmark.\""}, {"color": "#08bc79", "description": "\"\u0027Floor\u0027 means the benchmark rate floor, if any, provided in this Agreement with respect to any applicable Benchmark.\"\u003cSEP\u003e\"The minimum interest rate that can be applied in the event of a benchmark replacement.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"FLOOR\"", "label": "\"FLOOR\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Floor\u0027 means the benchmark rate floor, if any, provided in this Agreement with respect to any applicable Benchmark.\"\u003cSEP\u003e\"The minimum interest rate that can be applied in the event of a benchmark replacement.\""}, {"color": "#ee179d", "description": "\"Agreed Currency refers to the currency in which the loan is denominated, as specified in loan agreements.\"\u003cSEP\u003e\"The currency agreed upon for Borrowing transactions in the agreement.\"\u003cSEP\u003e\"The currency in which syndicated credit facilities are denominated and which may be subject to benchmark adjustments.\"\u003cSEP\u003e\"The currency specified in a contract or agreement used for any financial transactions.\"", "entity_type": "\"CURRENCY\"", "id": "\"AGREED CURRENCY\"", "label": "\"AGREED CURRENCY\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-c14cd42fa4cdb6464f56e1335cae13d8\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803", "title": "\"Agreed Currency refers to the currency in which the loan is denominated, as specified in loan agreements.\"\u003cSEP\u003e\"The currency agreed upon for Borrowing transactions in the agreement.\"\u003cSEP\u003e\"The currency in which syndicated credit facilities are denominated and which may be subject to benchmark adjustments.\"\u003cSEP\u003e\"The currency specified in a contract or agreement used for any financial transactions.\""}, {"color": "#d6370b", "description": "\"An adjustment made to reflect the differences between the old and new benchmarks in the calculations.\"\u003cSEP\u003e\"The Benchmark Replacement Adjustment is applied when calculating interest rates based on alternative benchmarks.\"", "entity_type": "\"AMENDMENT\"", "id": "\"BENCHMARK REPLACEMENT ADJUSTMENT\"", "label": "\"BENCHMARK REPLACEMENT ADJUSTMENT\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0", "title": "\"An adjustment made to reflect the differences between the old and new benchmarks in the calculations.\"\u003cSEP\u003e\"The Benchmark Replacement Adjustment is applied when calculating interest rates based on alternative benchmarks.\""}, {"color": "#6eab07", "description": "\"An authority that may have some influence on the determination of a benchmark or adjustment in financial agreements.\"\u003cSEP\u003e\"Relevant Governmental Body refers to the authority responsible for the administration of certain benchmarks.\"\u003cSEP\u003e\"the organization responsible for determining benchmark replacements for loans in various currencies.\"", "entity_type": "\"AGENCY\"", "id": "\"RELEVANT GOVERNMENTAL BODY\"", "label": "\"RELEVANT GOVERNMENTAL BODY\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44", "title": "\"An authority that may have some influence on the determination of a benchmark or adjustment in financial agreements.\"\u003cSEP\u003e\"Relevant Governmental Body refers to the authority responsible for the administration of certain benchmarks.\"\u003cSEP\u003e\"the organization responsible for determining benchmark replacements for loans in various currencies.\""}, {"color": "#70313e", "description": "\"The Bank of Japan or a committee officially endorsed or convened by the Bank of Japan.\"", "entity_type": "\"CORPORATION\"", "id": "\"BANK OF JAPAN\"", "label": "\"BANK OF JAPAN\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"The Bank of Japan or a committee officially endorsed or convened by the Bank of Japan.\""}, {"color": "#3e5a3a", "description": "\"The Swiss National Bank or a committee officially endorsed or convened by the Swiss National Bank.\"", "entity_type": "\"CORPORATION\"", "id": "\"SWISS NATIONAL BANK\"", "label": "\"SWISS NATIONAL BANK\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"The Swiss National Bank or a committee officially endorsed or convened by the Swiss National Bank.\""}, {"color": "#1f7a4d", "description": "\"Government agencies responsible for the collection of customs duties and taxes.\"", "entity_type": "\"AGENCY\"", "id": "\"CUSTOMS AND REVENUE AUTHORITIES\"", "label": "\"CUSTOMS AND REVENUE AUTHORITIES\"", "shape": "dot", "size": 10, "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"Government agencies responsible for the collection of customs duties and taxes.\""}, {"color": "#daa58e", "description": "\"Liens that are allowed under the terms of a financial agreement and are specified in the contract.\"", "entity_type": "\"LIEN\"", "id": "\"PERMITTED LIENS\"", "label": "\"PERMITTED LIENS\"", "shape": "dot", "size": 10, "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"Liens that are allowed under the terms of a financial agreement and are specified in the contract.\""}, {"color": "#160d7b", "description": "\"The specific date when a replacement benchmark is implemented following a benchmark transition event.\"", "entity_type": "\"EXECUTED DATE\"", "id": "\"BENCHMARK REPLACEMENT DATE\"", "label": "\"BENCHMARK REPLACEMENT DATE\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb", "title": "\"The specific date when a replacement benchmark is implemented following a benchmark transition event.\""}, {"color": "#603be5", "description": "\"\u0027FASB ASC\u0027 means the Accounting Standards Codification of the Financial Accounting Standards Board.\"", "entity_type": "\"REGULATORY\"", "id": "\"FASB ASC\"", "label": "\"FASB ASC\"", "shape": "dot", "size": 10, "source_id": "chunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027FASB ASC\u0027 means the Accounting Standards Codification of the Financial Accounting Standards Board.\""}, {"color": "#511a56", "description": "\"\u0027GAAP\u0027 means generally accepted accounting principles in the United States.\"\u003cSEP\u003e\"GAAP stands for Generally Accepted Accounting Principles that the Company and Borrowers must follow in preparing their financial statements.\"\u003cSEP\u003e\"GAAP stands for Generally Accepted Accounting Principles, which are accounting standards used to prepare financial statements.\"\u003cSEP\u003e\"Generally Accepted Accounting Principles that the Company must adhere to when maintaining its books and records.\"\u003cSEP\u003e\"Generally Accepted Accounting Principles, which guide the preparation of financial statements.\"", "entity_type": "\"REGULATORY\"", "id": "\"GAAP\"", "label": "\"GAAP\"", "shape": "dot", "size": 10, "source_id": "chunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027GAAP\u0027 means generally accepted accounting principles in the United States.\"\u003cSEP\u003e\"GAAP stands for Generally Accepted Accounting Principles that the Company and Borrowers must follow in preparing their financial statements.\"\u003cSEP\u003e\"GAAP stands for Generally Accepted Accounting Principles, which are accounting standards used to prepare financial statements.\"\u003cSEP\u003e\"Generally Accepted Accounting Principles that the Company must adhere to when maintaining its books and records.\"\u003cSEP\u003e\"Generally Accepted Accounting Principles, which guide the preparation of financial statements.\""}, {"color": "#c63ff8", "description": "\"the rate of interest last quoted by the Wall Street Journal as the Prime Rate in the United States.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"PRIME RATE\"", "label": "\"PRIME RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01", "title": "\"the rate of interest last quoted by the Wall Street Journal as the Prime Rate in the United States.\""}, {"color": "#f6fe6c", "description": "\"\u0027Federal Funds Effective Rate\u0027 means, for any day, the rate calculated by the NYFRB based on such day\u2019s federal funds transactions by depository institutions.\"\u003cSEP\u003e\"An interest rate used in the United States for transactions between banks, serving as a benchmark for other loans.\"", "entity_type": "\"BASE RATE BENCHMARK\"", "id": "\"FEDERAL FUNDS EFFECTIVE RATE\"", "label": "\"FEDERAL FUNDS EFFECTIVE RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Federal Funds Effective Rate\u0027 means, for any day, the rate calculated by the NYFRB based on such day\u2019s federal funds transactions by depository institutions.\"\u003cSEP\u003e\"An interest rate used in the United States for transactions between banks, serving as a benchmark for other loans.\""}, {"color": "#69ff38", "description": "\"\u0027Federal Reserve Board\u0027 means the Board of Governors of the Federal Reserve System of the United States.\"\u003cSEP\u003e\"The central banking authority of the United States that influences the economy and interest rates.\"", "entity_type": "\"REGULATORY\"", "id": "\"FEDERAL RESERVE BOARD\"", "label": "\"FEDERAL RESERVE BOARD\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Federal Reserve Board\u0027 means the Board of Governors of the Federal Reserve System of the United States.\"\u003cSEP\u003e\"The central banking authority of the United States that influences the economy and interest rates.\""}, {"color": "#e9eb5f", "description": "\"the Pension Benefit Guaranty Corporation, which protects pension benefits in the United States.\"", "entity_type": "\"CORPORATION\"", "id": "\"PBGC\"", "label": "\"PBGC\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01", "title": "\"the Pension Benefit Guaranty Corporation, which protects pension benefits in the United States.\""}, {"color": "#174623", "description": "\"the Pension Protection Act of 2006 which governs pension plans under ERISA.\"", "entity_type": "\"AGREEMENT\"", "id": "\"PENSION ACT\"", "label": "\"PENSION ACT\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01", "title": "\"the Pension Protection Act of 2006 which governs pension plans under ERISA.\""}, {"color": "#f2a12c", "description": "\"\u0027Default Rate\u0027 means an interest rate equal to (a) the Base Rate plus (b) the Applicable Rate applicable to Base Rate Loans plus (c) 2% per annum.\"\u003cSEP\u003e\"Default Rate refers to the interest rate applied in case of default under the loan agreement.\"\u003cSEP\u003e\"The Default Rate is the rate applied to past-due amounts under the agreement.\"", "entity_type": "\"INTEREST RATE\"", "id": "\"DEFAULT RATE\"", "label": "\"DEFAULT RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-365109d2a10139b03b825bac3b05cc13\u003cSEP\u003echunk-05b4cc5b2660656388ebad9cd016c596", "title": "\"\u0027Default Rate\u0027 means an interest rate equal to (a) the Base Rate plus (b) the Applicable Rate applicable to Base Rate Loans plus (c) 2% per annum.\"\u003cSEP\u003e\"Default Rate refers to the interest rate applied in case of default under the loan agreement.\"\u003cSEP\u003e\"The Default Rate is the rate applied to past-due amounts under the agreement.\""}, {"color": "#b599d7", "description": "\"the rules regarding minimum required contributions to Pension Plans set forth in the Code and ERISA.\"", "entity_type": "\"REGULATORY\"", "id": "\"PENSION FUNDING RULES\"", "label": "\"PENSION FUNDING RULES\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01", "title": "\"the rules regarding minimum required contributions to Pension Plans set forth in the Code and ERISA.\""}, {"color": "#202f8f", "description": "\"The Platform is a provided electronic system facilitating communications regarding the Borrower Materials between the Administrative Agent and the Borrower.\"\u003cSEP\u003e\"the system or program specified in Section 6.02.\"", "entity_type": "\"CORPORATION\"", "id": "\"PLATFORM\"", "label": "\"PLATFORM\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-6ab6e4615e53048f9d0e33ad97f0a57e", "title": "\"The Platform is a provided electronic system facilitating communications regarding the Borrower Materials between the Administrative Agent and the Borrower.\"\u003cSEP\u003e\"the system or program specified in Section 6.02.\""}, {"color": "#e277f4", "description": "\"\u0027Guarantee\u0027 means any obligation of a Person guaranteeing any Indebtedness or other obligation payable or performable by another Person.\"\u003cSEP\u003e\"Guarantee shall be deemed to be an amount equal to the stated or determinable amount of the related primary obligation.\"", "entity_type": "\"AGREEMENT\"", "id": "\"GUARANTEE\"", "label": "\"GUARANTEE\"", "shape": "dot", "size": 10, "source_id": "chunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Guarantee\u0027 means any obligation of a Person guaranteeing any Indebtedness or other obligation payable or performable by another Person.\"\u003cSEP\u003e\"Guarantee shall be deemed to be an amount equal to the stated or determinable amount of the related primary obligation.\""}, {"color": "#c953d0", "description": "\"Interest Period defines the duration for which the interest rate remains constant on a loan.\"\u003cSEP\u003e\"Interest Period means the specific time frame during which the interest rate is fixed for a loan.\"\u003cSEP\u003e\"Interest Period refers to the duration for which interest applies to each Borrowing.\"\u003cSEP\u003e\"Interest Period refers to the duration over which an interest rate is applied to a loan.\"\u003cSEP\u003e\"The Interest Period is the time duration for which the interest on a loan is calculated and remains constant.\"\u003cSEP\u003e\"The duration during which interest accrues on a loan.\"\u003cSEP\u003e\"The fixed length of time during which interest accrues on a financial instrument.\"\u003cSEP\u003e\"The specified time duration for which a loan is borrowed and interest is calculated.\"\u003cSEP\u003e\"The term defining the time interval for which interest rates are fixed on loans or borrowings.\"\u003cSEP\u003e\"The term that determines the duration for which certain interest rates apply to the loan agreements specified.\"\u003cSEP\u003e\"The timeframe during which interest rates are applied to loans based on benchmark rates.\"\u003cSEP\u003e\"the applicable Borrower wishes to request Term Benchmark Loans having an Interest Period that, pursuant to the definition of \u0027Interest Period\u0027 requires the consent of all the Lenders.\"", "entity_type": "\"SCHEDULE\"", "id": "\"INTEREST PERIOD\"", "label": "\"INTEREST PERIOD\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-c13f8f110a52f456f7cfa34d1627fa44\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-17156cdb19d248f88d4ee1e387dc4521\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f", "title": "\"Interest Period defines the duration for which the interest rate remains constant on a loan.\"\u003cSEP\u003e\"Interest Period means the specific time frame during which the interest rate is fixed for a loan.\"\u003cSEP\u003e\"Interest Period refers to the duration for which interest applies to each Borrowing.\"\u003cSEP\u003e\"Interest Period refers to the duration over which an interest rate is applied to a loan.\"\u003cSEP\u003e\"The Interest Period is the time duration for which the interest on a loan is calculated and remains constant.\"\u003cSEP\u003e\"The duration during which interest accrues on a loan.\"\u003cSEP\u003e\"The fixed length of time during which interest accrues on a financial instrument.\"\u003cSEP\u003e\"The specified time duration for which a loan is borrowed and interest is calculated.\"\u003cSEP\u003e\"The term defining the time interval for which interest rates are fixed on loans or borrowings.\"\u003cSEP\u003e\"The term that determines the duration for which certain interest rates apply to the loan agreements specified.\"\u003cSEP\u003e\"The timeframe during which interest rates are applied to loans based on benchmark rates.\"\u003cSEP\u003e\"the applicable Borrower wishes to request Term Benchmark Loans having an Interest Period that, pursuant to the definition of \u0027Interest Period\u0027 requires the consent of all the Lenders.\""}, {"color": "#6b85f7", "description": "\"Interest Payment Date is when interest on the Loans is due and payable.\"\u003cSEP\u003e\"Interest Payment Date refers to the date when interest is due for any loan.\"", "entity_type": "\"MATURITY DATE\"", "id": "\"INTEREST PAYMENT DATE\"", "label": "\"INTEREST PAYMENT DATE\"", "shape": "dot", "size": 10, "source_id": "chunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024", "title": "\"Interest Payment Date is when interest on the Loans is due and payable.\"\u003cSEP\u003e\"Interest Payment Date refers to the date when interest is due for any loan.\""}, {"color": "#308fd0", "description": "\"A defined day relevant for the calculation of risk-free rates used in financial agreements.\"\u003cSEP\u003e\"The RFR Business Day represents the operational days relevant for executing contracts in specified currencies.\"", "entity_type": "\"SCHEDULE\"", "id": "\"RFR BUSINESS DAY\"", "label": "\"RFR BUSINESS DAY\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb\u003cSEP\u003echunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"A defined day relevant for the calculation of risk-free rates used in financial agreements.\"\u003cSEP\u003e\"The RFR Business Day represents the operational days relevant for executing contracts in specified currencies.\""}, {"color": "#9e9314", "description": "\"RFR Business Days define the operational days crucial for executing RFR-related loans.\"|\u003c|\"Loan Execution\"", "entity_type": "\"UNKNOWN\"", "id": "\"LOAN EXECUTION\"", "label": "\"LOAN EXECUTION\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9", "title": "\"RFR Business Days define the operational days crucial for executing RFR-related loans.\"|\u003c|\"Loan Execution\""}, {"color": "#ff0e24", "description": "\"Daily Simple SOFR Loans are adjustable based on the SOFR rate changing daily.\"::", "entity_type": "\"UNKNOWN\"", "id": "\"DAILY SIMPLE SOFR LOAN\"", "label": "\"DAILY SIMPLE SOFR LOAN\"", "shape": "dot", "size": 10, "source_id": "chunk-05b4cc5b2660656388ebad9cd016c596", "title": "\"Daily Simple SOFR Loans are adjustable based on the SOFR rate changing daily.\"::"}, {"color": "#7dfc34", "description": "\"\u0027Indebtedness\u0027 refers to monetary obligations, including loans and credit.\"\u003cSEP\u003e\"Amount of debt or financial obligation that a party owes to another party.\"\u003cSEP\u003e\"Indebtedness means, as to any Person at a particular time, all obligations of such Person for borrowed money and all obligations evidenced by bonds, debentures, notes, loan agreements or other similar instruments.\"\u003cSEP\u003e\"Obligations that might be owed to the Lender from the Company or Borrower, as specified in the Loan Document.\"\u003cSEP\u003e\"Refers to the total liabilities owed by the Company, which may influence its ability to create Liens.\"", "entity_type": "\"FINANCIAL OBLIGATION\"", "id": "\"INDEBTEDNESS\"", "label": "\"INDEBTEDNESS\"", "shape": "dot", "size": 10, "source_id": "chunk-d4356ca46805b368884b787be8cbc403\u003cSEP\u003echunk-7b49249e042a5ea4c6773ec3c7bbc024\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d\u003cSEP\u003echunk-b187719dac182a293454abdbf819f856\u003cSEP\u003echunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"\u0027Indebtedness\u0027 refers to monetary obligations, including loans and credit.\"\u003cSEP\u003e\"Amount of debt or financial obligation that a party owes to another party.\"\u003cSEP\u003e\"Indebtedness means, as to any Person at a particular time, all obligations of such Person for borrowed money and all obligations evidenced by bonds, debentures, notes, loan agreements or other similar instruments.\"\u003cSEP\u003e\"Obligations that might be owed to the Lender from the Company or Borrower, as specified in the Loan Document.\"\u003cSEP\u003e\"Refers to the total liabilities owed by the Company, which may influence its ability to create Liens.\""}, {"color": "#f08a6b", "description": "\"\u0027Obligee\u0027 refers to a party entitled to receive payment under a contract or agreement.\"", "entity_type": "\"BORROWER\"", "id": "\"OBLIGEE\"", "label": "\"OBLIGEE\"", "shape": "dot", "size": 10, "source_id": "chunk-b187719dac182a293454abdbf819f856", "title": "\"\u0027Obligee\u0027 refers to a party entitled to receive payment under a contract or agreement.\""}, {"color": "#d9524b", "description": "\"A person or entity that buys a part of a loan or financial interest from a lender, gaining rights or obligations in that context.\"\u003cSEP\u003e\"Each Participant shall be entitled to the benefits of Sections 3.01, 3.04 and 3.05 to the same extent as if it were a Lender.\"\u003cSEP\u003e\"a party involved in the loan or financial agreement.\"", "entity_type": "\"ENTITY\"", "id": "\"PARTICIPANT\"", "label": "\"PARTICIPANT\"", "shape": "dot", "size": 10, "source_id": "chunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f\u003cSEP\u003echunk-cd612893d5a0225fd778ba086853009a", "title": "\"A person or entity that buys a part of a loan or financial interest from a lender, gaining rights or obligations in that context.\"\u003cSEP\u003e\"Each Participant shall be entitled to the benefits of Sections 3.01, 3.04 and 3.05 to the same extent as if it were a Lender.\"\u003cSEP\u003e\"a party involved in the loan or financial agreement.\""}, {"color": "#f430f7", "description": "\"An oversight body that monitors and governs the operations of benchmark administrators.\"", "entity_type": "\"REGULATORY\"", "id": "\"REGULATORY SUPERVISOR\"", "label": "\"REGULATORY SUPERVISOR\"", "shape": "dot", "size": 10, "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb", "title": "\"An oversight body that monitors and governs the operations of benchmark administrators.\""}, {"color": "#8531f3", "description": "\"A benchmark interest rate often used for loans denominated in euros.\"\u003cSEP\u003e\"The EURIBO Rate is applicable for Loans or Borrowings denominated in Euro.\"\u003cSEP\u003e\"The Euro Interbank Offered Rate used for calculating interest rates on loans in euro.\"\u003cSEP\u003e\"The Euro Interbank Offered Rate, a benchmark for loans within the Eurozone.\"\u003cSEP\u003e\"The euro interbank offered rate, which serves as a benchmark for rates applied to certain loans in the agreement.\"\u003cSEP\u003e\"the Euro Interbank Offered Rate used in Euro-denominated loans.\"", "entity_type": "\"BASE RATE BENCHMARK\"", "id": "\"EURIBO RATE\"", "label": "\"EURIBO RATE\"", "shape": "dot", "size": 10, "source_id": "chunk-c2d8e7576d4fa2fd6cc2e422f8c5e2f9\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-14c8b401e9169305f9280f527d16df01\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f", "title": "\"A benchmark interest rate often used for loans denominated in euros.\"\u003cSEP\u003e\"The EURIBO Rate is applicable for Loans or Borrowings denominated in Euro.\"\u003cSEP\u003e\"The Euro Interbank Offered Rate used for calculating interest rates on loans in euro.\"\u003cSEP\u003e\"The Euro Interbank Offered Rate, a benchmark for loans within the Eurozone.\"\u003cSEP\u003e\"The euro interbank offered rate, which serves as a benchmark for rates applied to certain loans in the agreement.\"\u003cSEP\u003e\"the Euro Interbank Offered Rate used in Euro-denominated loans.\""}, {"color": "#a0a914", "description": "\"A benchmark used to assess credit default obligations.\"\u003cSEP\u003e\"The CDO Rate is applicable for Loans or Borrowings denominated in Canadian Dollars.\"\u003cSEP\u003e\"The interest rate applied tation\"", "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8\u003cSEP\u003echunk-ce242614e7c70072950823bb3955e36c", "title": "\"All Loan Documents must be aligned with the Company\u0027s financial policy.\"\u003cSEP\u003e\"The Company is a party to the Loan Documents which detail the terms and conditions of its loan agreements.\"|", "to": "\"LOAN DOCUMENTS\"", "width": 15.0}, {"description": "\"Actions taken by the Company are expected to be in the Ordinary Course of Business.\"", "from": "\"COMPANY\"", "keywords": "\"business standard\"", "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"Actions taken by the Company are expected to be in the Ordinary Course of Business.\"", "to": "\"ORDINARY COURSE OF BUSINESS\"", "width": 6.0}, {"description": "\"The Company is bound by the terms of the Guaranty, which outlines its obligations toward the Guarantee Obligations.\"|\u003e\"binding agreement\"\u003cSEP\u003e\"The Guaranty binds the Company to guarantee the Obligations of Designated Borrowers.\"|\"", "from": "\"COMPANY\"", "keywords": "\"8\"\u003cSEP\u003e6", "source_id": "chunk-365109d2a10139b03b825bac3b05cc13\u003cSEP\u003echunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"The Company is bound by the terms of the Guaranty, which outlines its obligations toward the Guarantee Obligations.\"|\u003e\"binding agreement\"\u003cSEP\u003e\"The Guaranty binds the Company to guarantee the Obligations of Designated Borrowers.\"|\"", "to": "\"GUARANTY\"", "width": 7.0}, {"description": "\"The Company guarantees the timely payment of obligations under the Loan Documents, acting as a security for the Credit Parties.\"\u003c", "from": "\"COMPANY\"", "keywords": "\"guaranty\"", "source_id": "chunk-312f7b4d5463e218d8729ce3bfbd8941", "title": "\"The Company guarantees the timely payment of obligations under the Loan Documents, acting as a security for the Credit Parties.\"\u003c", "to": "\"GUARANTEE OBLIGATIONS\"", "width": 8.0}, {"description": "\"Relationship defined in the context of the Fee Letter dated September 19, 2023\"", "from": "\"COMPANY\"", "keywords": "\"Contractual Relationship\"", "source_id": "chunk-b187719dac182a293454abdbf819f856", "title": "\"Relationship defined in the context of the Fee Letter dated September 19, 2023\"", "to": "\"FEE LETTER\"", "width": 6.0}, {"description": "\"The Company agrees to the provisions related to the responsibilities of the Lender within the Agreement.\"\u003c\u003cSEP\u003e\"The Company borrows funds from the Lender and is obligated to repay the funds under the agreement terms.\"\u003c\u003cSEP\u003e\"The Company engages in financial arrangements with the Lender, providing them with information and financial statements regularly.\"\u003cSEP\u003e\"The Company is responsible for guaranteeing the obligations owed by Borrowers to the Lender.\"\u003c\u003cSEP\u003e\"The Company must obtain written consent from each Lender to modify its obligations under the agreement.\"\u003cSEP\u003e\"The Company must provide details of any Default to the Lender.\"\u003c\u003cSEP\u003e\"The Company obtains funds from the Lender in the form of loans which need to be repaid with interest.\"|\u003e\"Financing\"\u003cSEP\u003e\"The Company receives funds from the Lender under the terms of the loan agreement, making the Lender an essential part of the funding process.\"\u003cSEP\u003e\"The clauses detail obligations and conditions related to loans and assignments involving the Lender and the Company.\"\u003cSEP\u003e\"The obligations of the Company are owed to the Lender or its Affiliates under the Loan Documents.\"\u003cSEP\u003e\"The relationship between the Company and the Lender is defined within the context of financial agreements and obligations.\"", "from": "\"COMPANY\"", "keywords": "\"Consent Requirement\"\u003cSEP\u003e\"Financial Agreement\"\u003cSEP\u003e\"Financial Obligation\"\u003cSEP\u003e\"Lending\"\u003cSEP\u003e\"Loan Agreement\"\u003cSEP\u003e\"Loan Obligations\"\u003cSEP\u003e \"The relationship between the Company and the Lender is defined within the context of financial agreements and obligations.\"", "to": "\"LENDER\"", "width": 78.0}, {"description": "\"The Company is affected by the status of the Defaulting Lender when it comes to loan agreements, especially regarding consents.\"", "from": "\"COMPANY\"", "keywords": "\"Agreement conditions\"", "source_id": "chunk-b57613ab89c368fdc4da998c9b03876f", "title": "\"The Company is affected by the status of the Defaulting Lender when it comes to loan agreements, especially regarding consents.\"", "to": "\"DEFAULTING LENDER\"", "width": 1.0}, {"description": "\"The Company must adhere to regulations identified by ERISA in relation to pension plans and the use of plan assets in loan commitments.\"", "from": "\"COMPANY\"", "keywords": "\"Regulatory Compliance\"", "source_id": "chunk-1db9dc3eba353f5566836350c579edfe", "title": "\"The Company must adhere to regulations identified by ERISA in relation to pension plans and the use of plan assets in loan commitments.\"", "to": "\"ERISA\"", "width": 7.0}, {"description": "\"The Company must ensure compliance with OFAC rules in relation to the loans provided to any Designated Borrowers.\"|\"", "from": "\"COMPANY\"", "keywords": "6", "source_id": "chunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"The Company must ensure compliance with OFAC rules in relation to the loans provided to any Designated Borrowers.\"|\"", "to": "\"OFAC\"", "width": 6.0}, {"description": "\"The Company is exempt from registration under the Investment Company Act of 1940, indicating compliance with relevant financial regulations.\"", "from": "\"COMPANY\"", "keywords": "\"Regulatory Exemption\"", "source_id": "chunk-1db9dc3eba353f5566836350c579edfe", "title": "\"The Company is exempt from registration under the Investment Company Act of 1940, indicating compliance with relevant financial regulations.\"", "to": "\"INVESTMENT COMPANY ACT OF 1940\"", "width": 8.0}, {"description": "\"The Domestic Subsidiary is a branch or division of the Company operating within the same legal jurisdiction.\"", "from": "\"COMPANY\"", "keywords": "\"Corporate Structure\"", "source_id": "chunk-b187719dac182a293454abdbf819f856", "title": "\"The Domestic Subsidiary is a branch or division of the Company operating within the same legal jurisdiction.\"", "to": "\"DOMESTIC SUBSIDIARY\"", "width": 6.0}, {"description": "\"The company is required to comply with the PATRIOT Act when considering applications from Borrowers.\"|\"", "from": "\"COMPANY\"", "keywords": "6", "source_id": "chunk-5f3e48899c511bd9c1507e3c0453d886", "title": "\"The company is required to comply with the PATRIOT Act when considering applications from Borrowers.\"|\"", "to": "\"PATRIOT ACT\"", "width": 6.0}, {"description": "\"The Company is bound by the terms outlined in the Loan Document concerning its obligations and rights.\"\u003c", "from": "\"COMPANY\"", "keywords": "company-loan-document\u003c", "source_id": "chunk-cd612893d5a0225fd778ba086853009a", "title": "\"The Company is bound by the terms outlined in the Loan Document concerning its obligations and rights.\"\u003c", "to": "\"LOAN DOCUMENT\"", "width": 7.0}, {"description": "\"The Company controls the Subsidiary, meaning they have a parent-subsidiary relationship.\"\u003cSEP\u003e\"The Company must ensure its Subsidiary maintains corporate existence.\"\u003c", "from": "\"COMPANY\"", "keywords": "\"corporate structure\"\u003cSEP\u003eCorporate Structure\u003c", "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d", "title": "\"The Company controls the Subsidiary, meaning they have a parent-subsidiary relationship.\"\u003cSEP\u003e\"The Company must ensure its Subsidiary maintains corporate existence.\"\u003c", "to": "\"SUBSIDIARY\"", "width": 15.0}, {"description": "\"The Company has the obligation to mark Borrower Materials.\"\u003c", "from": "\"COMPANY\"", "keywords": "Documentation\u003c", "source_id": "chunk-9b1b3dbc667d28f3ba91031c5a47a78d", "title": "\"The Company has the obligation to mark Borrower Materials.\"\u003c", "to": "\"BORROWER MATERIALS\"", "width": 6.0}, {"description": "\"The Company cannot create Liens on its assets.\"\u003c\u003cSEP\u003e\"The Company may have Liens on its property to secure the payment of its debts.\"", "from": "\"COMPANY\"", "keywords": "\"financial obligation\"\u003cSEP\u003eRestrictive Conditions\u003c", "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d", "title": "\"The Company cannot create Liens on its assets.\"\u003c\u003cSEP\u003e\"The Company may have Liens on its property to secure the payment of its debts.\"", "to": "\"LIENS\"", "width": 15.0}, {"description": "\"The Administrative Agent acts on behalf of the Company in financial transactions.\"|\u003e\"Agency relation\"\u003cSEP\u003e\"The Administrative Agent acts on behalf of the Company to manage the agreement and facilitate communication with the Lenders.\"\u003cSEP\u003e\"The Administrative Agent acts on behalf of the Lenders in facilitating the agreement involving the Company.\"|\u003e\"Agent Role\"\u003cSEP\u003e\"The Administrative Agent administers the loan on behalf of the Company, ensuring compliance with the loan agreement.\"\u003cSEP\u003e\"The Administrative Agent is named alongside the Company in terms of legal responsibilities and actions.\"\u003cSEP\u003e\"The Administrative Agent manages relationships and decisions regarding the Company\u2019s loan agreements.\"|\"\u003cSEP\u003e\"The Administrative Agent oversees and enforces compliance with the loan agreement, making it essential to the Company\u0027s obligations.\"\u003c\u003cSEP\u003e\"The Administrative Agent oversees the loan agreements and manages the relationship between the Company and the Lenders.\"|\u003e\"Management and Oversight\"\u003cSEP\u003e\"The Company interacts with the Administrative Agent for various transaction processes and agreements.\"\u003cSEP\u003e\"The Company must give consent for assignments processed by the Administrative Agent, making them interdependent.\"\u003cSEP\u003e\"The Company must notify the Administrative Agent of any Default occurrence.\"\u003c\u003cSEP\u003e\"The Company must notify the Administrative Agent regarding an assignment or delegation of rights under the Agreement.\"\u003cSEP\u003e\"The Company relies on the Administrative Agent to facilitate communication and compliance for tax obligations under FATCA.\"", "from": "\"COMPANY\"", "keywords": "\"Administration\"\u003cSEP\u003e\"Agency Role\"\u003cSEP\u003e\"Agent Relation\"\u003cSEP\u003e\"Consent requirement\"\u003cSEP\u003e\"Management\"\u003cSEP\u003e\"Notification of Rights\"\u003cSEP\u003e\"Oversight\"\u003c\u003cSEP\u003e\"Transaction Interaction\"\u003cSEP\u003e6\u003cSEP\u003e7\u003cSEP\u003e8\u003cSEP\u003eNotification\u003c", "source_id": "chunk-d4356ca46805b368884b787be8cbc403\u003cSEP\u003echunk-6ab6e4615e53048f9d0e33ad97f0a57e\u003cSEP\u003echunk-681a8d93f2ef85ce7c68923bd55d27e4\u003cSEP\u003echunk-56136e12e5f98f2b092eac6106feb27e\u003cSEP\u003echunk-02ceaf00a3c9eb16269f4ca5175e1da9\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-b3968ce1cdbdbce306c2d8875f076185\u003cSEP\u003echunk-3407cac26fbf761cda3f472334e41a85\u003cSEP\u003echunk-9b1b3dbc667d28f3ba91031c5a47a78d\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-1a887c72da47ff4eea9f79e69a645a7b\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f\u003cSEP\u003echunk-0a2a3e7203d34544fcfc464c159ad06f", "title": "\"The Administrative Agent acts on behalf of the Company in financial transactions.\"|\u003e\"Agency relation\"\u003cSEP\u003e\"The Administrative Agent acts on behalf of the Company to manage the agreement and facilitate communication with the Lenders.\"\u003cSEP\u003e\"The Administrative Agent acts on behalf of the Lenders in facilitating the agreement involving the Company.\"|\u003e\"Agent Role\"\u003cSEP\u003e\"The Administrative Agent administers the loan on behalf of the Company, ensuring compliance with the loan agreement.\"\u003cSEP\u003e\"The Administrative Agent is named alongside the Company in terms of legal responsibilities and actions.\"\u003cSEP\u003e\"The Administrative Agent manages relationships and decisions regarding the Company\u2019s loan agreements.\"|\"\u003cSEP\u003e\"The Administrative Agent oversees and enforces compliance with the loan agreement, making it essential to the Company\u0027s obligations.\"\u003c\u003cSEP\u003e\"The Administrative Agent oversees the loan agreements and manages the relationship between the Company and the Lenders.\"|\u003e\"Management and Oversight\"\u003cSEP\u003e\"The Company interacts with the Administrative Agent for various transaction processes and agreements.\"\u003cSEP\u003e\"The Company must give consent for assignments processed by the Administrative Agent, making them interdependent.\"\u003cSEP\u003e\"The Company must notify the Administrative Agent of any Default occurrence.\"\u003c\u003cSEP\u003e\"The Company must notify the Administrative Agent regarding an assignment or delegation of rights under the Agreement.\"\u003cSEP\u003e\"The Company relies on the Administrative Agent to facilitate communication and compliance for tax obligations under FATCA.\"", "to": "\"ADMINISTRATIVE AGENT\"", "width": 66.0}, {"description": "\"The Company may file UCC financing statements to secure its interests in assets.\"", "from": "\"COMPANY\"", "keywords": "\"legal documentation\"", "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"The Company may file UCC financing statements to secure its interests in assets.\"", "to": "\"UCC FINANCING STATEMENTS\"", "width": 6.0}, {"description": "\"During this period, the Company must seek alternative borrowing options as the initial benchmark is not available.\"|\u003e\"Operational Adjustments\"", "from": "\"COMPANY\"", "keywords": "6", "source_id": "chunk-1a887c72da47ff4eea9f79e69a645a7b", "title": "\"During this period, the Company must seek alternative borrowing options as the initial benchmark is not available.\"|\u003e\"Operational Adjustments\"", "to": "\"BENCHMARK UNAVAILABILITY PERIOD\"", "width": 6.0}, {"description": "\"The legal framework governing the agreement is established under New York law.\"", "from": "\"COMPANY\"", "keywords": "\"Legal Jurisdiction\"", "source_id": "chunk-02ceaf00a3c9eb16269f4ca5175e1da9", "title": "\"The legal framework governing the agreement is established under New York law.\"", "to": "\"NEW YORK\"", "width": 6.0}, {"description": "\"The Company may enter into repurchase agreements to manage its liquidity.\"", "from": "\"COMPANY\"", "keywords": "\"financial management\"", "source_id": "chunk-c14cd42fa4cdb6464f56e1335cae13d8", "title": "\"The Company may enter into repurchase agreements to manage its liquidity.\"", "to": "\"REPURCHASE AGREEMENTS\"", "width": 7.0}, {"description": "\"The interest rates on Base Rate Loans can change based on the Term SOFR as defined in the loan documentation.\"", "from": "\"BASE RATE LOANS\"", "keywords": "\"Interest Rate Adjustment\"", "source_id": "chunk-b3968ce1cdbdbce306c2d8875f076185", "title": "\"The interest rates on Base Rate Loans can change based on the Term SOFR as defined in the loan documentation.\"", "to": "\"TERM SOFR\"", "width": 7.0}, {"description": "\"The Benchmark Replacement Conforming Changes apply to the Loan Documents to ensure compliance after a benchmark update.\"", "from": "\"LOAN DOCUMENTS\"", "keywords": "\"compliance alignment\"", "source_id": "chunk-bf49c9cb4d9dbf0f5ccdcc32de9179eb", "title": "\"The Benchmark Replacement Conforming Changes apply to the Loan Documents to ensure compliance after a benchmark update.\"", "to": "\"BENCHMARK REPLACEMENT CONFORMING CHANGES\"", "width": 7.0}, {"description": "\"The Benchmark Replacement is a key element defined within the Loan Docu  "\"Payments by the Borrowers shall be made in US Dollars.\"\u003c", "from": "\"BORROWERS\"", "keywords": "currency\u003c", "source_id": "chunk-f4d032810167311fd685322e589a9173", "title": "\"Payments by the Borrowers shall be made in US Dollars.\"\u003c", "to": "\"US DOLLARS\"", "width": 6.0}, {"description": "\"Borrowers must also comply with the conditions set by the Lenders for any amendments or waivers to the agreement.\"\u003cSEP\u003e\"Lenders provide loans to Borrowers under the agreement, establishing financial relationships.\"\u003cSEP\u003e\"The Lender\u0027s commitment to make Loans is to the Borrowers pursuant to Section 2.01.\"::", "from": "\"BORROWERS\"", "keywords": "\"Compliance\"\u003cSEP\u003e\"loans\"\u003cSEP\u003e[\"Loan Commitment\", \"Financial Relationship\"]", "source_id": "chunk-05b4cc5b2660656388ebad9cd016c596\u003cSEP\u003echunk-20a3929bb24620011868bc1e55295803\u003cSEP\u003echunk-6ab6e4615e53048f9d0e33ad97f0a57e", "title": "\"Borrowers must also comply with the conditions set by the Lenders for any amendments or waivers to the agreement.\"\u003cSEP\u003e\"Lenders provide loans to Borrowers under the agreement, establishing financial relationships.\"\u003cSEP\u003e\"The Lender\u0027s commitment to make Loans is to the Borrowers pursuant to Section 2.01.\"::", "to": "\"LENDER\"", "width": 10.0}, {"description": "\"Borrower has certain obligations under Loan Documents implying a legal and financial connection.\"\u003cSEP\u003e\"Borrowers have financial obligations to the Lender that must be met under the loan agreement.\"", "from": "\"BORROWER\"", "keywords": "\"Liabilities\"\u003cSEP\u003e\"Loan Agreement\"", "source_id": "chunk-1677b99670ec966f5fd1919664061d01\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74", "title": "\"Borrower has certain obligations under Loan Documents implying a legal and financial connection.\"\u003cSEP\u003e\"Borrowers have financial obligations to the Lender that must be met under the loan agreement.\"", "to 3cSEP\u003e\"The Borrowers secure funding from the Lenders under specified conditions and obligations.\"\u003cSEP\u003e\"The Lender provides Loans to the Borrowers under the Loan Document, creating a borrower-lender relationship.\"\u003cSEP\u003e\"The Lender provides funds to the Borrower as per the loan agreements.\"\u003c\u003cSEP\u003e\"The Lender provides loans to Borrowers, making them responsible for repayment according to the terms outlined in the loan document.\"\u003cSEP\u003e\"The borrower receives loans from the lender and is obligated to repay the loans under the agreed terms.\"\u003cSEP\u003e\"The lender provides funds to the borrower, creating a financial obligation for repayment.\"", "from": "\"BORROWER\"", "keywords": "\"Financial Transactions\"\u003cSEP\u003e\"Fund Provision\"\u003c\u003cSEP\u003e\"Funding Relationship\"\u003cSEP\u003e\"Loan Agreement\"\u003cSEP\u003e\"Loan Obligations\"\u003cSEP\u003e\"Loan Provision\"\u003cSEP\u003e\"Loan provision\"\u003cSEP\u003e\"lending\"\u003cSEP\u003e\"obligation\"\u003cSEP\u003e8", "source_id": "chunk-63dba9e522714ac0a8717c04f114cbd9\u003cSEP\u003echunk-1db9dc3eba353f5566836350c579edfe\u003cSEP\u003echunk-681a8d93f2ef85ce7c68923bd55d27e4\u003cSEP\u003echunk-cfb372b965947cb79981661e12746f74\u003cSEP\u003echunk-c72ac38860fa8c92501d3a2b3a580efb\u003cSEP\u003echunk-cb93392f69f11919011ae9632eeb26aa\u003cSEP\u003echunk-f878f9bb708e5f123411182579bddcb8\u003cSEP\u003echunk-024104f61867a710efed88937d20b566\u003cSEP\u003echunk-70346a0ac74ecfe6bd503edd172112c0\u003cSEP\u003echunk-b57613ab89c368fdc4da998c9b03876f", "title": "\"Lenders provide funds to Borrowers under the Loan Documents.\"\u003cSEP\u003e\"Lenders represent and warrant compliance for the Borrower\u0027s obligations under the Loan Agreement.\"\u003cSEP\u003e\"The Borrower must satisfy the conditions set by the Lender before a Loan Notice can be honored.\"\u003c\u003cSEP\u003e\"The Borrower receives loans from the Lender as defined by the agreement terms.\"|\u003e\"Loan agreement\"\u003cSEP\u003e\"The Borrowers secure funding from the Lenders under specified conditions and obligations.\"\u003cSEP\u003e\"The Lender provides Loans to the Borrowers under the Loan Document, creating a borrower-lender relationship.\"\u003cSEP\u003e\"The Lender provides funds to the Borrower as per the loan agreements.\"\u003c\u003cSEP\u003e\"The Lender provides loans to Borrowers, making them responsible for repayment according to the terms outlined in the loan document.\"\u003cSEP\u003e\"The borrower receives loans from the lender and is obligated to repay the loans under the agreed terms.\"\u003cSEP\u003e\"The lender provides funds to the borrower, creating a financial obligation for repayment.\"", "to": "\"LENDER\"", "width": 46.0}, {"description": "\"The Administrative Agent may have relationships with affiliates regarding loan agreements.\"", "from": "\"AFFILIATES\"", "keywords": "\"Affiliation\"", "source_id": "chunk-681a8d93f2ef85ce7c68923bd55d27e4", "title": "\"The Administrative Agent may have relationships with affiliates regarding loan agreements.\"", "to": "\"ADMINISTRATIVE AGENT\"", "width": 1.0}, {"description": "\"Richard Bernal is the authorized signatory representing Societe Generale in the credit agreement.\"", "from": "\"SOCIETE GENERALE\"", "keywords": "\"representation\"", "source_id": "chunk-f6b97897a15d341a1e0572d6368a4290", "title": "\"Richard Bernal is the authorized signatory representing Societe Generale in the credit agreement.\"", "to": "\"RICHARD BERNAL\"", "width": 9.0}, {"description": "\"The Administrative Agent manages and oversees the compliance and payment of all Obligations by the Borrowers.\"\u003c\u003cSEP\u003e\"The Administrative Agent manages the application of funds related to Obligations.\"", "from": "\"OBLIGATIONS\"", "keywords": "\"Management\"\u003cSEP\u003e\"management\"", "source_id": "chunk-8c4b020bf60daa77bdf0578ce86ca311\u003cSEP\u003echunk-312f7b4d5463e218d8729ce3bfbd8941", "title": "\" EP\u003e\"The Administrative Agent is involved in arranging and providing services to Lenders.\"\u003cSEP\u003e\"The Administrative Agent manages the payment distribution and notifications related to the Lender\u0027s activities.\"|\"\u003cSEP\u003e\"The Administrative Agent notifies each Lender about the details of Loan agreements and any changes.\"\u003c\u003cSEP\u003e\"The Administrative Agent oversees the agreement and maintains compliance on behalf of all Lenders.\"\u003cSEP\u003e\"The Administrative Agent oversees the compliance of the Loan Document and coordinates between Borrowers and Lenders.\"\u003cSEP\u003e\"The Lender agrees to notify the Company and the Administrative Agent promptly after any such setoff applies.\"\u003cSEP\u003e\"The Lender authorizes the Administrative Agent to set off and apply any amounts owing to the Lender under this Agreement... \"\u003cSEP\u003e\"The Lender irrevocably appoints Citibank, N.A. as the Administrative Agent.\"\u003cSEP\u003e\"The Lender is subject to the authority of the Administrative Agent, establishing a coordination relationship related to loan obligations.\"\u003c\u003cSEP\u003e\"The Lender relies on the Administrative Agent for the proper notification and enforcement of rights and remedies as outlined in the loan documents.\"\u003c\u003cSEP\u003e\"The administrative agent manages the loan agreement on behalf of the lenders, facilitating communication and payment processes.\"", "from": "\"ADMINISTRATIVE AGENT\"", "keywords": "\"Agency\"\u003cSEP\u003e\"Agent role\"\u003cSEP\u003e\"Agreements and Transactions\"\u003cSEP\u003e\"Communication\"\u003c\u003cSEP\u003e\"Coordination\"\u003c\u003cSEP\u003e\"Facilitation\"\u003cSEP\u003e\"Management\"\u003cSEP\u003e\"Notification\"\u003cSEP\u003e\"Oversight\"\u003cSEP\u003e\"cooperation\"\u003cSEP\u003e\"oversight\"\u003cSEP\u003e7\u003cSEP\u003eAuthorization\u003cSEP\u003eagent-lender\u003c\u003cSEP\u003eenforcement\u003cSEP\u003emanagement\u003c", "source_id": "chunk- inistration\"\u003cSEP\u003e\"The Administrative Agent facilitates the assignment process for lenders, maintaining necessary records and overseeing transactions.\"\u003cSEP\u003e\"The Administrative Agent has a non-fiduciary role helping facilitate the relationship between the Company and each Lender.\"\u003c\u003cSEP\u003e\"The Administrative Agent is involved in arranging and providing services to Lenders.\"\u003cSEP\u003e\"The Administrative Agent manages the payment distribution and notifications related to the Lender\u0027s activities.\"|\"\u003cSEP\u003e\"The Administrative Agent notifies each Lender about the details of Loan agreements and any changes.\"\u003c\u003cSEP\u003e\"The Administrative Agent oversees the agreement and maintains compliance on behalf of all Lenders.\"\u003cSEP\u003e\"The Administrative Agent oversees the compliance of the Loan Document and coordinates between Borrowers and Lenders.\"\u003cSEP\u003e\"The Lender agrees to notify the Company and the Administrative Agent promptly after any such setoff applies.\"\u003cSEP\u003e\"The Lender authorizes the Administrative Agent to set off and apply any amounts owing to the Lender under this Agreement... \"\u003cSEP\u003e\"The Lender irrevocably appoints Citibank, N.A. as the Administrative Agent.\"\u003cSEP\u003e\"The Lender is subject to the authority of the Administrative Agent, establishing a coordination relationship related to loan obligations.\"\u003c\u003cSEP\u003e\"The Lender relies on the Administrative Agent for the proper notification and enforcement of rights and remedies as outlined in the loan documents.\"\u003c\u003cSEP\u003e\"The administrative agent manages the loan agreement on behalf of the lenders, facilitating communication and payment processes.\"", "to": "\"LENDER\"", "width": 110.0}, {"description": "\"NYFRB Rate serves as a benchmark interest rate that impacts the loans provided by Lenders.\"", "from": "\"LENDER\"", "keywords": "\"Interest Rate Benchmark\"", "source_id                           document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
